[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoom-guard"
description = "Policy- and evidence-bound change admission, with AI-generated patches as the primary use case."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mana Alharbi (مانع الحربي)" }]
maintainers = [{ name = "Mana Alharbi (مانع الحربي)" }]
keywords = ["ai", "agents", "ci", "testing", "reward-hacking", "patch", "verification"]
license = { file = "LICENSE" }
# Open-core, dual-licensed by path (see LICENSING.md): the reward-hack-resistant
# gate core is Apache-2.0 (LICENSE-APACHE); the trust platform stays EvoRise
# Source-Available (LICENSE). The package-level classifier is deliberately the
# more restrictive umbrella so an automated license scan never reads the whole
# distribution as Apache; the Apache grant on the core paths is stated by
# LICENSING.md, which ships with the distribution.
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
# The whole gate is stdlib-only — nothing to install beyond Python and git/patch.
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/EvoRiseKsa/EvoOM-Guard-m"
Issues = "https://github.com/EvoRiseKsa/EvoOM-Guard-m/issues"

[project.scripts]
evo-guard = "evoom_guard.cli:main"

[project.optional-dependencies]
# Ed25519 verdict/evidence signing (keygen, --sign-key, verify-verdict/bundle).
sign = ["cryptography>=41"]
# Changed-line coverage evidence (evo-guard guard --diff-coverage).
cov = ["coverage>=7"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "coverage>=7",
    "cryptography>=41",
    "jsonschema>=4.23",
]

[tool.setuptools]
# Ship every governing license/notice with the distribution so the open-core
# boundary travels with the package: the source-available umbrella (LICENSE),
# the Apache-2.0 core license (LICENSE-APACHE), the authoritative path->license
# map (LICENSING.md), and the attribution/notice file (NOTICE).
license-files = ["LICENSE", "LICENSE-APACHE", "LICENSING.md", "NOTICE"]

[tool.setuptools.package-data]
evoom_guard = ["schemas/*.json", "templates/**/*.json", "templates/**/*.yml"]

[tool.setuptools.packages.find]
include = ["evoom_guard*"]

[tool.setuptools.dynamic]
version = { attr = "evoom_guard.__version__" }

# ───────────────────────────── tooling ──────────────────────────────────────
[tool.pytest.ini_options]
# The repo's OWN suite is tests/. examples/ holds black-box verifier packs meant
# to run under the Guard judge (with EVOGUARD_* env + a candidate target), not as
# part of this repo's suite — so `python -m pytest -q` collects only tests/.
testpaths = ["tests"]
# Frozen verifier packs contain test_*.py files for the external judge. They are
# evidence fixtures, not members of EvoOM Guard's own pytest suite; collecting
# them would also write __pycache__ into and invalidate the frozen pack digest.
norecursedirs = ["tests/baseline"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["evoom_guard"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Signing, coverage, and fuzzing dependencies are optional: type-checking must
# pass when those extras/tools are not installed.
module = ["atheris", "cryptography.*", "coverage", "coverage.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["evoom_guard"]
branch = true

[tool.coverage.report]
# Branch-coverage floor. The gate runs only in the Linux "Tests + coverage" CI
# step, whose branch-inclusive total rose from 83% to 84% after direct branch
# tests for the weakest security-sensitive modules landed:
#   workspace 54->59, runtime_identity 63->65, verifiers/fidelity 66->70.
# This ratchet from 78 to 80 guards that measured gain with a ~4-point margin
# for run-to-run variation. It is a regression guard, not a target: raise it
# again only after real branch tests move the number, never by writing tests
# whose only purpose is the percentage.
fail_under = 80
