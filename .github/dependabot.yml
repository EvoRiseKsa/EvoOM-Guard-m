version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    # This compatibility backport is installed from a separately reviewed,
    # hash-locked file. Dependabot only edits the .in declaration and cannot
    # regenerate or review the matching multi-wheel SHA-256 lock, so its
    # automated PR would be incomplete and fail closed. Update both files
    # deliberately under the dependency-integrity procedure instead.
    ignore:
      - dependency-name: importlib-resources
    groups:
      development-dependencies:
        dependency-type: development
