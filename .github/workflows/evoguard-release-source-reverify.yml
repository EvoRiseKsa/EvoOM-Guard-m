name: EvoGuard Release Source Reverify

on:
  workflow_dispatch:
    inputs:
      promotion_run_id:
        description: Exact successful signed-source promotion run with retirement proof
        required: true
        type: string
      promotion_run_attempt:
        description: Exact promotion run attempt
        required: true
        type: string

permissions: {}

env:
  EVOGUARD_MAINTAINER_ROOT: security/release-maintainer-roots/v4.7.0.json

jobs:
  metadata:
    if: github.ref == 'refs/heads/main' && vars.EVOGUARD_RELEASE_SOURCE_V2_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: evoguard-release-source-reverify
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.main.outputs.target_sha }}
      target_tree_sha: ${{ steps.main.outputs.target_tree_sha }}
      parent_sha: ${{ steps.main.outputs.parent_sha }}
      parent_tree_sha: ${{ steps.main.outputs.parent_tree_sha }}
      repository_id: ${{ steps.main.outputs.repository_id }}
    steps:
      - id: main
        name: Resolve exact protected main before candidate execution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTROL_PATH: ${{ runner.temp }}/release-source.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/main' || context.payload.repository.default_branch !== 'main') {
              throw new Error('V2 source reverify must be dispatched from protected main');
            }
            const branch = (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data;
            if (branch.protected !== true) {
              throw new Error('main is not protected; source reverify is forbidden');
            }
            const targetSha = branch.commit.sha;
            const target = (await github.rest.git.getCommit({ owner, repo, commit_sha: targetSha })).data;
            const repositoryCommit = (await github.rest.repos.getCommit({
              owner, repo, ref: targetSha,
            })).data;
            if (!Array.isArray(target.parents) || target.parents.length !== 1) {
              throw new Error('V2 source reverify requires a non-merge main commit with one parent');
            }
            const verification = repositoryCommit.commit?.verification;
            if (repositoryCommit.parents?.length !== 1 ||
                repositoryCommit.parents[0].sha !== target.parents[0].sha ||
                verification?.verified !== true || verification.reason !== 'valid' ||
                typeof verification.signature !== 'string' || !verification.signature ||
                typeof verification.payload !== 'string' || !verification.payload ||
                repositoryCommit.author?.login !== 'EvoRiseKsa' ||
                repositoryCommit.author?.id !== 231647061 ||
                repositoryCommit.committer?.login !== 'EvoRiseKsa' ||
                repositoryCommit.committer?.id !== 231647061) {
              throw new Error('release source is not the exact GitHub-verified maintainer-signed commit');
            }
            const parentSha = target.parents[0].sha;
            const parent = (await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha })).data;
            if (!/^[1-9][0-9]*$/.test(process.env.PROMOTION_RUN_ID || '') ||
                !/^[1-9][0-9]*$/.test(process.env.PROMOTION_RUN_ATTEMPT || '')) {
              throw new Error('promotion run identity is not canonical');
            }
            const promotionRun = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.PROMOTION_RUN_ID),
            })).data;
            if (promotionRun.path !== '.github/workflows/evoguard-promote-signed-release-source.yml' ||
                promotionRun.event !== 'workflow_dispatch' || promotionRun.status !== 'completed' ||
                promotionRun.conclusion !== 'success' || promotionRun.head_branch !== 'main' ||
                promotionRun.head_sha !== parentSha ||
                promotionRun.run_attempt !== Number(process.env.PROMOTION_RUN_ATTEMPT) ||
                promotionRun.repository?.id !== context.payload.repository.id) {
              throw new Error('promotion run is not the exact successful parent-bound authority closure');
            }
            const source = {
              default_branch: 'main',
              protected_ref: 'refs/heads/main',
              repository: `${owner}/${repo}`,
              repository_id: String(context.payload.repository.id),
              target_commit_sha: targetSha,
              target_tree_sha: target.tree.sha,
              workflow_run_attempt: Number(process.env.RUN_ATTEMPT),
              workflow_run_id: process.env.RUN_ID,
              promotion_run_id: process.env.PROMOTION_RUN_ID,
              promotion_run_attempt: Number(process.env.PROMOTION_RUN_ATTEMPT),
            };
            fs.writeFileSync(process.env.CONTROL_PATH, JSON.stringify(source) + '\n', { encoding: 'utf8', mode: 0o600 });
            core.setOutput('target_sha', targetSha);
            core.setOutput('target_tree_sha', target.tree.sha);
            core.setOutput('parent_sha', parentSha);
            core.setOutput('parent_tree_sha', parent.tree.sha);
            core.setOutput('repository_id', String(context.payload.repository.id));

      - name: Check out the exact trusted parent authority verifier without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.main.outputs.parent_sha }}
          persist-credentials: false
          path: authority

      - name: Download the exact promotion-run retirement artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evoguard-signed-source-retirement-${{ inputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/promotion-retirement
          run-id: ${{ inputs.promotion_run_id }}
          github-token: ${{ github.token }}

      - id: retirement_binding
        name: Verify and bind the exact active-to-retired promotion artifact
        env:
          TARGET_SHA: ${{ steps.main.outputs.target_sha }}
          PARENT_SHA: ${{ steps.main.outputs.parent_sha }}
          REPOSITORY_ID: ${{ steps.main.outputs.repository_id }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        run: |
          set -euo pipefail
          binding="$RUNNER_TEMP/source-retirement-binding.json"
          python -I "$GITHUB_WORKSPACE/authority/tools/ci/validate_release_source_retirement_artifact.py" \
            --artifact "$RUNNER_TEMP/promotion-retirement" \
            --expected-repository "EvoRiseKsa/EvoOM-Guard-m" \
            --expected-repository-id "$REPOSITORY_ID" \
            --expected-base-sha "$PARENT_SHA" \
            --expected-candidate-sha "$TARGET_SHA" \
            --expected-promotion-run-id "$PROMOTION_RUN_ID" \
            --expected-promotion-run-attempt "$PROMOTION_RUN_ATTEMPT" \
            --binding-out "$binding"
          test "$(jq -er '.target.base_sha | select(type == "string")' "$binding")" = "$PARENT_SHA"
          test "$(jq -er '.target.candidate_sha | select(type == "string")' "$binding")" = "$TARGET_SHA"
          test "$(jq -er '.target.promotion_completed | select(type == "boolean")' "$binding")" = true
          test "$(jq -er '.active_source_authority.main_sha | select(type == "string")' "$binding")" = "$PARENT_SHA"
          test "$(jq -er '.retired_source_authority.main_sha | select(type == "string")' "$binding")" = "$TARGET_SHA"
          ruleset_id="$(jq -er '.main_ruleset_id | select(type == "number" and floor == . and . > 0)' "$binding")"
          deploy_key_id="$(jq -er '.retired_source_deploy_key.id | select(type == "number" and floor == . and . > 0)' "$binding")"
          fingerprint="$(jq -er '.retired_source_deploy_key.fingerprint | select(type == "string")' "$binding")"
          [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$deploy_key_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          printf 'main_ruleset_id=%s\n' "$ruleset_id" >> "$GITHUB_OUTPUT"
          printf 'source_deploy_key_id=%s\n' "$deploy_key_id" >> "$GITHUB_OUTPUT"
          printf 'source_deploy_key_fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Recapture retired source authority before candidate execution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT_PATH: ${{ runner.temp }}/release-source-authority-retired.json
          EXPECTED_RULESET_ID: ${{ steps.retirement_binding.outputs.main_ruleset_id }}
        with:
          github-token: ${{ secrets.EVOGUARD_RELEASE_SOURCE_CONTROL_PLANE_TOKEN }}
          script: |
            const capture = require(
              `${process.env.GITHUB_WORKSPACE}/authority/tools/ci/capture_release_source_protection.js`
            );
            await capture({
              github,
              context,
              outputPath: process.env.OUTPUT_PATH,
              expectedRulesetId: process.env.EXPECTED_RULESET_ID,
            });

      - name: Fail closed unless source transport authority remains retired
        env:
          TARGET_SHA: ${{ steps.main.outputs.target_sha }}
          EXPECTED_RULESET_ID: ${{ steps.retirement_binding.outputs.main_ruleset_id }}
          RETIRED_DEPLOY_KEY_ID: ${{ steps.retirement_binding.outputs.source_deploy_key_id }}
          RETIRED_DEPLOY_KEY_FINGERPRINT: ${{ steps.retirement_binding.outputs.source_deploy_key_fingerprint }}
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/authority/tools/ci/validate_release_source_protection.py" \
            --snapshot "$RUNNER_TEMP/release-source-authority-retired.json" \
            --authority-state source-retired \
            --expected-repository "EvoRiseKsa/EvoOM-Guard-m" \
            --expected-repository-id "$GITHUB_REPOSITORY_ID" \
            --expected-main-sha "$TARGET_SHA" \
            --expected-ruleset-id "$EXPECTED_RULESET_ID" \
            --expected-deploy-key-id "$RETIRED_DEPLOY_KEY_ID" \
            --expected-deploy-key-fingerprint "$RETIRED_DEPLOY_KEY_FINGERPRINT" \
            --receipt "$RUNNER_TEMP/release-source-authority-retired-receipt.json"

      - name: Upload pre-execution source control
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evoguard-release-source-control-v2-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-source.json
            ${{ runner.temp }}/source-retirement-binding.json
            ${{ runner.temp }}/release-source-authority-retired.json
            ${{ runner.temp }}/release-source-authority-retired-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  reverify:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up the unprivileged judge Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download exact pre-execution source control
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evoguard-release-source-control-v2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control

      - name: Reject a partial re-run before candidate execution
        env:
          CONTROL: ${{ runner.temp }}/control/release-source.json
          RETIREMENT_BINDING: ${{ runner.temp }}/control/source-retirement-binding.json
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        run: |
          set -euo pipefail
          test "$(jq -r .workflow_run_id "$CONTROL")" = "$GITHUB_RUN_ID"
          test "$(jq -r .workflow_run_attempt "$CONTROL")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -er '.target.main_sha | select(type == "string")' "$RETIREMENT_BINDING")" = "$TARGET_SHA"
          test "$(jq -er '.promotion_run.run_id | select(type == "string")' "$RETIREMENT_BINDING")" = "$PROMOTION_RUN_ID"
          test "$(jq -er '.promotion_run.run_attempt | select(type == "number")' "$RETIREMENT_BINDING")" = "$PROMOTION_RUN_ATTEMPT"

      - name: Require the exact GitHub-hosted protected-main workflow revision
        env:
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$TARGET_SHA"

      - name: Checkout exact parent as the trusted verifier-pack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.parent_sha }}
          path: base
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact protected-main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the raw release commit against the parent-pinned maintainer root
        env:
          PARENT_SHA: ${{ needs.metadata.outputs.parent_sha }}
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
        run: |
          set -euo pipefail
          objects="$RUNNER_TEMP/signed-release-source.git"
          git init --bare "$objects"
          git -C "$objects" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_TERMINAL_PROMPT=0 git -C "$objects" fetch --quiet --no-tags origin \
            "$PARENT_SHA" "$TARGET_SHA"
          python -I "$GITHUB_WORKSPACE/base/tools/ci/verify_release_git_object.py" commit \
            --repository "$objects" \
            --object "$TARGET_SHA" \
            --root "$GITHUB_WORKSPACE/base/$EVOGUARD_MAINTAINER_ROOT" \
            --expected-parent "$PARENT_SHA" \
            --receipt "$RUNNER_TEMP/release-source-signature.json"

      - name: Install hash-locked judge dependencies from the trusted parent
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --require-hashes -r "$GITHUB_WORKSPACE/base/security/judge-requirements.lock"

      - name: Download and pin the prior Guard runtime
        env:
          BOOTSTRAP_URL: ${{ vars.EVOGUARD_BOOTSTRAP_RUNTIME_URL }}
          BOOTSTRAP_SHA256: ${{ vars.EVOGUARD_BOOTSTRAP_RUNTIME_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_URL"
          [[ "$BOOTSTRAP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/evo-guard.pyz" "$BOOTSTRAP_URL"
          printf '%s  %s\n' "$BOOTSTRAP_SHA256" "$RUNNER_TEMP/evo-guard.pyz" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/evo-guard.pyz"

      - name: Validate the parent-owned release policy before candidate execution
        env:
          PACK_SHA256: ${{ vars.EVOGUARD_RELEASE_SOURCE_PACK_SHA256 }}
          CANDIDATE_IMAGE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        run: |
          set -euo pipefail
          python -I - "$GITHUB_WORKSPACE/base/.evoguard.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f'duplicate policy key: {key}')
                  value[key] = item
              return value

          path = pathlib.Path(sys.argv[1])
          policy = json.loads(path.read_text(encoding='utf-8'), object_pairs_hook=unique)
          required = {
              'policy_id': 'evoom-guard-protected-release-source',
              'policy_version': '2',
              'protected': [
                  '*',
                  '.github/workflows/*',
                  '.github/CODEOWNERS',
                  '.evoguard.json',
                  'LICENSE',
                  'NOTICE',
                  'evidence/release-ledgers/*',
                  'security/release-ledger-roots/*',
                  'security/release-pipeline-bootstrap.json',
                  'security/release-source-pack/*',
                  'security/*.lock',
              ],
              'allow': [
                  'CHANGELOG.md',
                  'PROJECT_STATUS.json',
                  'README.md',
                  'ROADMAP.md',
                  'SECURITY.md',
                  'docs/GITHUB_ARTIFACT_ATTESTATIONS.md',
                  'docs/PROJECT_STATUS.md',
                  'docs/RELEASE_STATUS.md',
                  'docs/SBOM.md',
                  'docs/architecture/REFACTOR_PROGRAM.md',
                  'evoom_guard/__init__.py',
              ],
              'allow_new_tests': False,
              'verifier_pack': 'security/release-source-pack',
              'expect_verifier_pack_sha256': os.environ['PACK_SHA256'],
              'blackbox': True,
              'blackbox_only': True,
              'isolation': 'docker',
              'docker_image': os.environ['CANDIDATE_IMAGE'],
              'docker_network': 'none',
              'require_report_integrity': 'external_process_isolated',
              'require_candidate_isolation': 'docker',
              'trust_setup_on_host': False,
          }
          for key, expected in required.items():
              if policy.get(key) != expected:
                  raise SystemExit(f'parent release policy mismatch: {key}')
          PY

      - name: Enforce the exact parent-owned v4.7.0 candidate scope
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/base/tools/ci/validate_release_candidate_scope.py" \
            --base "$GITHUB_WORKSPACE/base" \
            --candidate "$GITHUB_WORKSPACE/candidate"

      - name: Verify exact dev0 benchmark evidence carry-forward with parent code
        env:
          BASE_ROOT: ${{ github.workspace }}/base
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          python -I - "$BASE_ROOT" "$CANDIDATE_ROOT" <<'PY'
          import pathlib
          import sys

          base = pathlib.Path(sys.argv[1]).resolve()
          candidate = pathlib.Path(sys.argv[2]).resolve()
          sys.path.insert(0, str(base))

          from benchmarks.run_live import (
              BASELINE_DEFINITION,
              ENGINE_VERSION,
              RUN_SETTINGS,
              corpus_definition,
          )
          from benchmarks.run_manifest import verify_run_manifest

          if ENGINE_VERSION != '4.7.0.dev0':
              raise SystemExit('trusted parent is not the exact 4.7.0.dev0 source')
          exact_errors = verify_run_manifest(
              base / 'benchmarks/run-manifest.json',
              root=base,
              corpus=corpus_definition(),
              settings=RUN_SETTINGS,
              baseline_definition=BASELINE_DEFINITION,
              engine_version=ENGINE_VERSION,
              required_history_tip='HEAD',
            )
          if exact_errors:
              raise SystemExit(
                  'trusted parent benchmark rejected: ' + '; '.join(exact_errors)
              )
          promotion_errors = verify_run_manifest(
              candidate / 'benchmarks/run-manifest.json',
              root=candidate,
              corpus=corpus_definition(),
              settings=RUN_SETTINGS,
              baseline_definition=BASELINE_DEFINITION,
              engine_version='4.7.0',
              require_release_promotion=True,
              required_history_tip='HEAD',
            )
          if promotion_errors:
              raise SystemExit(
                  'release benchmark promotion rejected: '
                  + '; '.join(promotion_errors)
              )
          print(
              'release benchmark promotion verified: '
              'relation=exact-release-version-transition'
          )
          PY

      - name: Pull the byte-pinned candidate runtime image
        env:
          CANDIDATE_IMAGE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE_IMAGE"

      - name: Strong Docker black-box reverify
        env:
          BASE_SHA: ${{ needs.metadata.outputs.parent_sha }}
          BASE_TREE_SHA: ${{ needs.metadata.outputs.parent_tree_sha }}
          HEAD_SHA: ${{ needs.metadata.outputs.target_sha }}
          HEAD_TREE_SHA: ${{ needs.metadata.outputs.target_tree_sha }}
          PACK_SHA256: ${{ vars.EVOGUARD_RELEASE_SOURCE_PACK_SHA256 }}
          CANDIDATE_IMAGE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        run: |
          set -euo pipefail
          [[ "$PACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python -I "$RUNNER_TEMP/evo-guard.pyz" guard \
            --base "$GITHUB_WORKSPACE/base" \
            --head "$GITHUB_WORKSPACE/candidate" \
            --config "$GITHUB_WORKSPACE/base/.evoguard.json" \
            --base-sha "$BASE_SHA" --base-tree-sha "$BASE_TREE_SHA" \
            --head-sha "$HEAD_SHA" --head-tree-sha "$HEAD_TREE_SHA" \
            --verifier-pack "$GITHUB_WORKSPACE/base/security/release-source-pack" \
            --expect-verifier-pack-sha256 "$PACK_SHA256" \
            --blackbox --blackbox-only \
            --isolation docker --docker-image "$CANDIDATE_IMAGE" --docker-network none \
            --require-report-integrity external_process_isolated \
            --require-candidate-isolation docker \
            --json "$RUNNER_TEMP/verdict.json"

      - name: Derive raw-Git controls and canonical handoff
        env:
          CONTROL: ${{ runner.temp }}/control/release-source.json
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          objects="$RUNNER_TEMP/objects.git"
          git init --bare "$objects"
          git -C "$objects" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_TERMINAL_PROMPT=0 git -C "$objects" fetch --quiet --no-tags origin "+refs/heads/main:refs/heads/main"
          test "$(git -C "$objects" rev-parse refs/heads/main)" = "$TARGET_SHA"
          python -I "$RUNNER_TEMP/evo-guard.pyz" derive-release-source-controls \
            "$RUNNER_TEMP/verdict.json" --source "$CONTROL" \
            --git-repository "$objects" --git-repository-bare \
            --source-out "$RUNNER_TEMP/source.json" --context-out "$RUNNER_TEMP/context.json"
          cmp "$CONTROL" "$RUNNER_TEMP/source.json"
          python -I "$RUNNER_TEMP/evo-guard.pyz" release-source-handoff \
            "$RUNNER_TEMP/verdict.json" --source "$RUNNER_TEMP/source.json" \
            --context "$RUNNER_TEMP/context.json" --out "$RUNNER_TEMP/handoff.json"

      - name: Upload data-only strong reverify evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evoguard-release-source-evidence-v2-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/handoff.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Upload independent source-signature receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evoguard-release-source-governance-v1-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-source-signature.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
