            sha256sum --check --strict SHA256SUMS
          )

      - name: Approve the exact intent without creating a tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
