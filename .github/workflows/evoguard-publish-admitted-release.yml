              -a \( \
                \( "$tag_created" = "false" -a "$tag_absent" = "true" \) \
                -o \( "$tag_created" = "true" -a "$tag_exact" = "true" \) \
              \) \
              && RELEASE_BODY="$body" python - \
                "$record" "$RUNNER_TEMP/cleanup-exact-release.json" "$RELEASE_ID" <<'PY'
          import json
          import os
          import pathlib
          import sys

          record_path, release_path = map(pathlib.Path, sys.argv[1:3])
          expected_id = int(sys.argv[3])
          record = json.loads(record_path.read_text(encoding='utf-8'))
          release = json.loads(release_path.read_text(encoding='utf-8'))
          if (
              release.get('id') != expected_id
              or release.get('tag_name') != record['tag']
              or release.get('name') != record['tag']
              or release.get('target_commitish') != record['target_sha']
              or release.get('draft') is not True
              or release.get('prerelease') is not False
              or release.get('body') != os.environ['RELEASE_BODY']
              or release.get('author', {}).get('login') != 'github-actions[bot]'
              or release.get('author', {}).get('id') != 41898282
          ):
              raise SystemExit(1)
          assets = release.get('assets')
          if not isinstance(assets, list) or len(assets) != len(record['assets']):
              raise SystemExit(1)
          for asset in assets:
              if not isinstance(asset, dict) or asset.get('name') not in record['assets']:
                  raise SystemExit(1)
              expected = record['assets'][asset['name']]
              if (
                  asset.get('state') != 'uploaded'
