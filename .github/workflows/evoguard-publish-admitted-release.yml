              metadata = item.lstat()
              if (
                  stat.S_ISLNK(metadata.st_mode)
                  or not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_nlink != 1
              ):
                  raise SystemExit(f'unsafe publication-ready type: {item.name}')
          record = json.loads((root / 'publication-ready.json').read_text(encoding='utf-8'))
          if set(record) != {
              'format', 'repository', 'target_sha', 'tag',
              'g_run_id', 'g_run_attempt',
              'tag_deploy_key_fingerprint', 'host_tools', 'assets',
          } or record.get('format') != 'EVOGUARD_RELEASE_PUBLICATION_READY_V1':
              raise SystemExit('unsupported publication-ready record')
