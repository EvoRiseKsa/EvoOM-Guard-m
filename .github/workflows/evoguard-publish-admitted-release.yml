              'git', 'gh', 'ssh', 'ssh_keygen',
          }:
              raise SystemExit('publication-ready host tool set is not exact')
          commands = {
              'git': 'git', 'gh': 'gh', 'ssh': 'ssh', 'ssh_keygen': 'ssh-keygen',
          }
          for name, command in commands.items():
              located = shutil.which(command)
              if located is None:
                  raise SystemExit(f'publication host tool is missing: {name}')
              path = pathlib.Path(located).resolve(strict=True)
              before = path.lstat()
              if (
                  not stat.S_ISREG(before.st_mode)
                  or stat.S_ISLNK(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_size < 1
                  or before.st_size > 64 * 1024 * 1024
              ):
