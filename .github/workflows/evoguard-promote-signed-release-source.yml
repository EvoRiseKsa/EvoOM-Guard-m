        run: |
          set -euo pipefail
          python -I - "$RUNNER_TEMP/promotion" "$BASE_SHA" "$CANDIDATE_SHA" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import sys

          root = pathlib.Path(sys.argv[1])
          if {item.name for item in root.iterdir()} != {
              'control.json', 'local-commit-signature.json',
              'release-freeze-verification.json',
              'release-freeze-github-anchor.json',
              'release-freeze-github-anchor-receipt.json',
          }:
              raise SystemExit('promotion evidence set is not closed')
          for item in root.iterdir():
              metadata = item.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f'unsafe promotion evidence: {item.name}')
          control = json.loads((root / 'control.json').read_text(encoding='utf-8'))
          receipt = (root / 'local-commit-signature.json').read_bytes()
          expected = control.get('local_signature_receipt')
          freeze = (root / 'release-freeze-verification.json').read_bytes()
          expected_freeze = control.get('release_freeze_receipt')
          anchor = (root / 'release-freeze-github-anchor.json').read_bytes()
          anchor_receipt = (
              root / 'release-freeze-github-anchor-receipt.json'
          ).read_bytes()
          expected_anchor = control.get('release_freeze_github_anchor')
          expected_source_authority = {
              'main_ruleset_id': int(os.environ['EXPECTED_MAIN_RULESET_ID']),
              'source_deploy_key_id': int(os.environ['EXPECTED_SOURCE_DEPLOY_KEY_ID']),
              'source_deploy_key_fingerprint': (
                  os.environ['EXPECTED_SOURCE_DEPLOY_KEY_FINGERPRINT']
              ),
          }
          expected_freeze_workflow_ids = {
              'windows': int(os.environ['FREEZE_WINDOWS_WORKFLOW_ID']),
              'codeql': int(os.environ['FREEZE_CODEQL_WORKFLOW_ID']),
              'ci': int(os.environ['FREEZE_CI_WORKFLOW_ID']),
              'cflite': int(os.environ['FREEZE_CFLITE_WORKFLOW_ID']),
          }
          if (
              control.get('format') != 'EVOGUARD_SIGNED_SOURCE_PROMOTION_CONTROL_V1'
              or control.get('base_sha') != sys.argv[2]
              or control.get('candidate_sha') != sys.argv[3]
              or control.get('parent_count') != 1
              or control.get('source_authority') != expected_source_authority
              or control.get('freeze_workflow_ids') != expected_freeze_workflow_ids
              or not isinstance(expected, dict)
              or expected.get('path') != 'local-commit-signature.json'
              or expected.get('sha256') != hashlib.sha256(receipt).hexdigest()
              or expected.get('size') != len(receipt)
              or not isinstance(expected_freeze, dict)
              or expected_freeze.get('path') != 'release-freeze-verification.json'
              or expected_freeze.get('sha256') != hashlib.sha256(freeze).hexdigest()
              or expected_freeze.get('size') != len(freeze)
              or not isinstance(expected_anchor, dict)
              or expected_anchor.get('snapshot_path')
                 != 'release-freeze-github-anchor.json'
              or expected_anchor.get('snapshot_sha256')
                 != hashlib.sha256(anchor).hexdigest()
              or expected_anchor.get('snapshot_size') != len(anchor)
              or expected_anchor.get('receipt_path')
                 != 'release-freeze-github-anchor-receipt.json'
              or expected_anchor.get('receipt_sha256')
                 != hashlib.sha256(anchor_receipt).hexdigest()
              or expected_anchor.get('receipt_size') != len(anchor_receipt)
          ):
              raise SystemExit('promotion evidence identity mismatch')
          PY
          objects="$RUNNER_TEMP/promotion-objects.git"
          git init --bare "$objects"
          git -C "$objects" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_TERMINAL_PROMPT=0 git -C "$objects" fetch --quiet --no-tags origin \
