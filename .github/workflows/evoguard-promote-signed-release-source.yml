      - id: active_evidence
        name: Bind the create-only source-active artifact descriptors
        env:
          SNAPSHOT: ${{ runner.temp }}/source-authority-active.json
          RECEIPT: ${{ runner.temp }}/source-authority-active-receipt.json
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat

          paths = {
              'snapshot': pathlib.Path(os.environ['SNAPSHOT']),
              'receipt': pathlib.Path(os.environ['RECEIPT']),
          }
          for label, path in paths.items():
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  raise SystemExit(f'unsafe source-active {label}')
              raw = path.read_bytes()
              if not raw or len(raw) > 2 * 1024 * 1024:
                  raise SystemExit(f'unbounded source-active {label}')
              json.loads(raw)
              with pathlib.Path(os.environ['GITHUB_OUTPUT']).open(
                  'a', encoding='utf-8', newline='\n'
              ) as output:
                  output.write(f'{label}_sha256={hashlib.sha256(raw).hexdigest()}\n')
                  output.write(f'{label}_size={len(raw)}\n')
          PY

