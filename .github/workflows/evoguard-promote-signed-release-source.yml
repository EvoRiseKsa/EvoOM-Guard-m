name: EvoGuard Promote Signed Release Source

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact locally signed one-parent v4.7.0 candidate commit
        required: true
        type: string
      pull_request_number:
        description: Open reviewed pull request whose exact head is candidate_sha
        required: true
        type: string

permissions: {}

concurrency:
  group: evoguard-release-source-promotion
  cancel-in-progress: false

env:
  EVOGUARD_RELEASE_VERSION: "4.7.0"
  EVOGUARD_MAINTAINER_ROOT: security/release-maintainer-roots/v4.7.0.json

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.EVOGUARD_RELEASE_SOURCE_PROMOTION_ENABLED == inputs.candidate_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.control.outputs.base_sha }}
      base_tree_sha: ${{ steps.control.outputs.base_tree_sha }}
      candidate_sha: ${{ steps.control.outputs.candidate_sha }}
      candidate_tree_sha: ${{ steps.control.outputs.candidate_tree_sha }}
      pull_request_number: ${{ steps.control.outputs.pull_request_number }}
      main_ruleset_id: ${{ steps.control.outputs.main_ruleset_id }}
      source_deploy_key_id: ${{ steps.control.outputs.source_deploy_key_id }}
      source_deploy_key_fingerprint: ${{ steps.control.outputs.source_deploy_key_fingerprint }}
      freeze_windows_workflow_id: ${{ steps.control.outputs.freeze_windows_workflow_id }}
      freeze_codeql_workflow_id: ${{ steps.control.outputs.freeze_codeql_workflow_id }}
      freeze_ci_workflow_id: ${{ steps.control.outputs.freeze_ci_workflow_id }}
      freeze_cflite_workflow_id: ${{ steps.control.outputs.freeze_cflite_workflow_id }}
    steps:
      - id: control
        name: Bind exact protected base, signed candidate, review, and checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          FREEZE_DECLARATION_SHA: ${{ vars.EVOGUARD_V470_FREEZE_DECLARATION_SHA }}
          FREEZE_DECLARATION_TREE_SHA: ${{ vars.EVOGUARD_V470_FREEZE_DECLARATION_TREE_SHA }}
          MAIN_RULESET_ID: ${{ vars.EVOGUARD_RELEASE_MAIN_RULESET_ID }}
          SOURCE_DEPLOY_KEY_ID: ${{ vars.EVOGUARD_RELEASE_SOURCE_DEPLOY_KEY_ID }}
          SOURCE_DEPLOY_KEY_FINGERPRINT: ${{ vars.EVOGUARD_RELEASE_SOURCE_DEPLOY_KEY_FINGERPRINT }}
          FREEZE_WINDOWS_WORKFLOW_ID: ${{ vars.EVOGUARD_V470_FREEZE_WINDOWS_WORKFLOW_ID }}
          FREEZE_CODEQL_WORKFLOW_ID: ${{ vars.EVOGUARD_V470_FREEZE_CODEQL_WORKFLOW_ID }}
          FREEZE_CI_WORKFLOW_ID: ${{ vars.EVOGUARD_V470_FREEZE_CI_WORKFLOW_ID }}
          FREEZE_CFLITE_WORKFLOW_ID: ${{ vars.EVOGUARD_V470_FREEZE_CFLITE_WORKFLOW_ID }}
          CONTROL_PATH: ${{ runner.temp }}/signed-source-control.json
        with:
          script: |
            const fs = require('fs');
            const shaPattern = /^[0-9a-f]{40}$/;
            const numberPattern = /^[1-9][0-9]*$/;
            const candidateSha = process.env.CANDIDATE_SHA;
            if (!shaPattern.test(candidateSha || '')) {
              throw new Error('candidate_sha must be one lowercase 40-hex commit ID');
            }
            if (!numberPattern.test(process.env.PR_NUMBER || '')) {
              throw new Error('pull_request_number must be one positive integer');
            }
            const frozenIds = new Map([
              ['main ruleset ID', process.env.MAIN_RULESET_ID],
              ['source deploy-key ID', process.env.SOURCE_DEPLOY_KEY_ID],
              ['freeze Windows workflow ID', process.env.FREEZE_WINDOWS_WORKFLOW_ID],
              ['freeze CodeQL workflow ID', process.env.FREEZE_CODEQL_WORKFLOW_ID],
              ['freeze CI workflow ID', process.env.FREEZE_CI_WORKFLOW_ID],
              ['freeze ClusterFuzzLite workflow ID', process.env.FREEZE_CFLITE_WORKFLOW_ID],
            ]);
            for (const [label, value] of frozenIds) {
              if (!numberPattern.test(value || '') || !Number.isSafeInteger(Number(value))) {
                throw new Error(`${label} must be one canonical safe positive integer`);
              }
            }
            const sourceFingerprint = process.env.SOURCE_DEPLOY_KEY_FINGERPRINT;
            if (!/^SHA256:[A-Za-z0-9+/]{43}$/.test(sourceFingerprint || '') ||
                sourceFingerprint === 'SHA256:iCn7wa6HgKdu7luf/16rrKZzSk5FygJoA8EKNl3LJ24') {
              throw new Error('source deploy-key fingerprint is noncanonical or reuses the maintainer root');
            }
            if (context.ref !== 'refs/heads/main' ||
                context.payload.repository.default_branch !== 'main' ||
                process.env.GITHUB_SHA !== process.env.GITHUB_WORKFLOW_SHA) {
              throw new Error('promotion workflow must execute from the exact protected-main workflow revision');
            }
            const pull_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data;
            if (branch.protected !== true || !shaPattern.test(branch.commit?.sha || '')) {
              throw new Error('main is not one exact protected commit');
            }
            const baseSha = branch.commit.sha;
            if (baseSha !== process.env.GITHUB_SHA || baseSha === candidateSha) {
              throw new Error('workflow revision is not the unchanged promotion base');
            }
            const base = (await github.rest.git.getCommit({
              owner, repo, commit_sha: baseSha,
            })).data;
            if (baseSha !== process.env.FREEZE_DECLARATION_SHA ||
                base.tree?.sha !== process.env.FREEZE_DECLARATION_TREE_SHA) {
              throw new Error('current main is not the owner-pinned freeze declaration commit/tree');
            }
            const candidate = (await github.rest.repos.getCommit({
              owner, repo, ref: candidateSha,
            })).data;
            if (!Array.isArray(candidate.parents) || candidate.parents.length !== 1 ||
                candidate.parents[0].sha !== baseSha ||
                !shaPattern.test(candidate.commit?.tree?.sha || '')) {
              throw new Error('candidate is not an exact one-parent child of current main');
            }
            const verification = candidate.commit?.verification;
            if (!verification || verification.verified !== true ||
                verification.reason !== 'valid' ||
                typeof verification.signature !== 'string' || !verification.signature ||
                typeof verification.payload !== 'string' || !verification.payload) {
              throw new Error('GitHub does not report a valid signature for the candidate');
            }
            for (const actor of [candidate.author, candidate.committer]) {
              if (!actor || actor.login !== 'EvoRiseKsa' || actor.id !== 231647061) {
                throw new Error('candidate GitHub author/committer is not the frozen maintainer account');
              }
            }
            const pr = (await github.rest.pulls.get({owner, repo, pull_number})).data;
            if (pr.state !== 'open' || pr.draft === true || pr.base?.ref !== 'main' ||
                pr.base?.sha !== baseSha || pr.head?.sha !== candidateSha ||
                pr.head?.repo?.full_name !== `${owner}/${repo}`) {
              throw new Error('pull request is not the exact open same-repository candidate review');
            }
            const reviews = await github.paginate(
              github.rest.pulls.listReviews, {owner, repo, pull_number, per_page: 100}
            );
            const maintainerReviews = reviews
              .filter(item => item.user?.login === 'MANA-awam' && item.user?.id === 304223352)
              .sort((left, right) => Number(left.id) - Number(right.id));
            const finalReview = maintainerReviews.at(-1);
            if (!finalReview || finalReview.state !== 'APPROVED' ||
                finalReview.commit_id !== candidateSha) {
              throw new Error('the exact candidate head lacks the frozen reviewer approval');
            }
            let cursor = null;
            let threadCount = 0;
            do {
              const result = await github.graphql(`
                query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      reviewDecision
                      mergeStateStatus
                      headRefOid
                      baseRefOid
                      reviewThreads(first:100, after:$cursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`, {owner, repo, number: pull_number, cursor});
              const threads = result.repository?.pullRequest?.reviewThreads;
              const decision = result.repository?.pullRequest;
              if (decision?.reviewDecision !== 'APPROVED' ||
                  decision?.mergeStateStatus !== 'CLEAN' ||
                  decision?.headRefOid !== candidateSha ||
                  decision?.baseRefOid !== baseSha) {
                throw new Error('GitHub does not report the exact PR as globally approved and clean');
              }
              if (!threads || !Array.isArray(threads.nodes)) {
                throw new Error('pull-request review-thread state is unavailable');
              }
              threadCount += threads.nodes.length;
              if (threadCount > 1000 || threads.nodes.some(item => item.isResolved !== true)) {
                throw new Error('pull request has unresolved or unbounded review threads');
              }
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              if (threads.pageInfo.hasNextPage && !cursor) {
                throw new Error('review-thread pagination is incomplete');
              }
            } while (cursor);
            const requiredChecks = new Map([
              ['test (3.10)', 15368],
              ['test (3.11)', 15368],
              ['test (3.12)', 15368],
              ['e2e-runners', 15368],
              ['blackbox-docker-e2e', 15368],
              ['smoke', 15368],
              ['analyze', 15368],
              ['CodeQL', 57789],
              ['project-status', 15368],
              ['fuzz (address)', 15368],
              ['fuzz (undefined)', 15368],
            ]);
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {owner, repo, ref: candidateSha, per_page: 100, filter: 'latest'}
            );
            for (const [name, appId] of requiredChecks) {
              const matches = checkRuns.filter(
                item => item.name === name && item.app?.id === appId
              );
              if (matches.length !== 1 || matches[0].status !== 'completed' ||
                  matches[0].conclusion !== 'success' ||
                  matches[0].head_sha !== candidateSha) {
                throw new Error(`required exact-head check is not uniquely successful: ${name}`);
              }
            }
            const control = {
              format: 'EVOGUARD_SIGNED_SOURCE_PROMOTION_CONTROL_V1',
              repository: `${owner}/${repo}`,
              repository_id: String(context.payload.repository.id),
              workflow_run_id: String(context.runId),
              workflow_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              base_sha: baseSha,
              base_tree_sha: base.tree.sha,
              candidate_sha: candidateSha,
              candidate_tree_sha: candidate.commit.tree.sha,
              parent_count: candidate.parents.length,
              pull_request_number: pull_number,
              approving_reviewer: {login: 'MANA-awam', id: 304223352},
              github_signer: {login: 'EvoRiseKsa', id: 231647061},
              github_verification: {verified: true, reason: 'valid'},
              source_authority: {
                main_ruleset_id: Number(process.env.MAIN_RULESET_ID),
                source_deploy_key_id: Number(process.env.SOURCE_DEPLOY_KEY_ID),
                source_deploy_key_fingerprint: sourceFingerprint,
              },
              freeze_workflow_ids: {
                windows: Number(process.env.FREEZE_WINDOWS_WORKFLOW_ID),
                codeql: Number(process.env.FREEZE_CODEQL_WORKFLOW_ID),
                ci: Number(process.env.FREEZE_CI_WORKFLOW_ID),
                cflite: Number(process.env.FREEZE_CFLITE_WORKFLOW_ID),
              },
              required_checks: [...requiredChecks].map(([name, app_id]) => ({name, app_id})),
            };
            fs.writeFileSync(process.env.CONTROL_PATH, JSON.stringify(control) + '\n', {
              encoding: 'utf8', mode: 0o600, flag: 'wx',
            });
            core.setOutput('base_sha', baseSha);
            core.setOutput('base_tree_sha', base.tree.sha);
            core.setOutput('candidate_sha', candidateSha);
            core.setOutput('candidate_tree_sha', candidate.commit.tree.sha);
            core.setOutput('pull_request_number', String(pull_number));
            core.setOutput('main_ruleset_id', process.env.MAIN_RULESET_ID);
            core.setOutput('source_deploy_key_id', process.env.SOURCE_DEPLOY_KEY_ID);
            core.setOutput('source_deploy_key_fingerprint', sourceFingerprint);
            core.setOutput('freeze_windows_workflow_id', process.env.FREEZE_WINDOWS_WORKFLOW_ID);
            core.setOutput('freeze_codeql_workflow_id', process.env.FREEZE_CODEQL_WORKFLOW_ID);
            core.setOutput('freeze_ci_workflow_id', process.env.FREEZE_CI_WORKFLOW_ID);
            core.setOutput('freeze_cflite_workflow_id', process.env.FREEZE_CFLITE_WORKFLOW_ID);

      - name: Checkout exact protected parent as trusted release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control.outputs.base_sha }}
          path: base
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact immutable signed candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Capture GitHub server-time anchor for the exact freeze declaration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DECLARATION_SHA: ${{ steps.control.outputs.base_sha }}
          DECLARATION_TREE_SHA: ${{ steps.control.outputs.base_tree_sha }}
          OUTPUT_PATH: ${{ runner.temp }}/release-freeze-github-anchor.json
        with:
          script: |
            const capture = require(
              `${process.env.GITHUB_WORKSPACE}/base/tools/ci/capture_minor_release_freeze_anchor.js`
            );
            await capture({
              github,
              context,
              declarationSha: process.env.DECLARATION_SHA,
              declarationTreeSha: process.env.DECLARATION_TREE_SHA,
              outputPath: process.env.OUTPUT_PATH,
            });

      - name: Enforce exact parent-owned v4.7.0 candidate scope before promotion
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/base/tools/ci/validate_release_candidate_scope.py" \
            --base "$GITHUB_WORKSPACE/base" \
            --candidate "$GITHUB_WORKSPACE/candidate"

      - name: Verify the exact raw candidate commit with the pinned maintainer root
        env:
          BASE_SHA: ${{ steps.control.outputs.base_sha }}
          BASE_TREE_SHA: ${{ steps.control.outputs.base_tree_sha }}
          CANDIDATE_SHA: ${{ steps.control.outputs.candidate_sha }}
          FREEZE_WINDOWS_WORKFLOW_ID: ${{ steps.control.outputs.freeze_windows_workflow_id }}
          FREEZE_CODEQL_WORKFLOW_ID: ${{ steps.control.outputs.freeze_codeql_workflow_id }}
          FREEZE_CI_WORKFLOW_ID: ${{ steps.control.outputs.freeze_ci_workflow_id }}
          FREEZE_CFLITE_WORKFLOW_ID: ${{ steps.control.outputs.freeze_cflite_workflow_id }}
        run: |
          set -euo pipefail
          objects="$RUNNER_TEMP/signed-source-objects.git"
          git init --bare "$objects"
          git -C "$objects" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          GIT_TERMINAL_PROMPT=0 git -C "$objects" fetch --quiet --no-tags origin \
            "$BASE_SHA" "$CANDIDATE_SHA"
          test "$(git -C "$objects" rev-parse "$CANDIDATE_SHA^")" = "$BASE_SHA"
          python -I "$GITHUB_WORKSPACE/base/tools/ci/validate_minor_release_freeze.py" \
            --root "$GITHUB_WORKSPACE/base" \
            --repository "$objects" \
            --declaration-commit "$BASE_SHA" \
            --expected-tree "$BASE_TREE_SHA" \
            --receipt "$RUNNER_TEMP/release-freeze-verification.json"
          python -I "$GITHUB_WORKSPACE/base/tools/ci/validate_release_freeze_github_anchor.py" \
            --root "$GITHUB_WORKSPACE/base" \
            --snapshot "$RUNNER_TEMP/release-freeze-github-anchor.json" \
            --expected-declaration-commit "$BASE_SHA" \
            --expected-declaration-tree "$BASE_TREE_SHA" \
            --expected-repository-id "$GITHUB_REPOSITORY_ID" \
            --expected-windows-workflow-id "$FREEZE_WINDOWS_WORKFLOW_ID" \
            --expected-codeql-workflow-id "$FREEZE_CODEQL_WORKFLOW_ID" \
            --expected-ci-workflow-id "$FREEZE_CI_WORKFLOW_ID" \
            --expected-cflite-workflow-id "$FREEZE_CFLITE_WORKFLOW_ID" \
            --receipt "$RUNNER_TEMP/release-freeze-github-anchor-receipt.json"
          python -I "$GITHUB_WORKSPACE/base/tools/ci/verify_release_git_object.py" commit \
            --repository "$objects" \
            --object "$CANDIDATE_SHA" \
            --root "$GITHUB_WORKSPACE/base/$EVOGUARD_MAINTAINER_ROOT" \
            --expected-parent "$BASE_SHA" \
            --receipt "$RUNNER_TEMP/local-commit-signature.json"

      - name: Close and upload preflight evidence
        env:
          CONTROL: ${{ runner.temp }}/signed-source-control.json
          RECEIPT: ${{ runner.temp }}/local-commit-signature.json
          FREEZE_RECEIPT: ${{ runner.temp }}/release-freeze-verification.json
          FREEZE_ANCHOR: ${{ runner.temp }}/release-freeze-github-anchor.json
          FREEZE_ANCHOR_RECEIPT: ${{ runner.temp }}/release-freeze-github-anchor-receipt.json
        run: |
          set -euo pipefail
          python -I - "$CONTROL" "$RECEIPT" "$RUNNER_TEMP/signed-source-preflight" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import sys

          control_path, receipt_path, output = map(pathlib.Path, sys.argv[1:])
          output.mkdir(mode=0o700)
          for source, name, limit in (
              (control_path, 'control.json', 64 * 1024),
              (receipt_path, 'local-commit-signature.json', 64 * 1024),
              (pathlib.Path(os.environ['FREEZE_RECEIPT']),
               'release-freeze-verification.json', 64 * 1024),
              (pathlib.Path(os.environ['FREEZE_ANCHOR']),
               'release-freeze-github-anchor.json', 2 * 1024 * 1024),
              (pathlib.Path(os.environ['FREEZE_ANCHOR_RECEIPT']),
               'release-freeze-github-anchor-receipt.json', 64 * 1024),
          ):
              metadata = source.lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  raise SystemExit(f'unsafe preflight evidence: {source}')
              data = source.read_bytes()
              if not data or len(data) > limit:
                  raise SystemExit(f'unbounded preflight evidence: {source}')
              json.loads(data)
              (output / name).write_bytes(data)
          receipt = (output / 'local-commit-signature.json').read_bytes()
          control = json.loads((output / 'control.json').read_text(encoding='utf-8'))
          control['local_signature_receipt'] = {
              'path': 'local-commit-signature.json',
              'sha256': hashlib.sha256(receipt).hexdigest(),
              'size': len(receipt),
          }
          freeze = (output / 'release-freeze-verification.json').read_bytes()
          control['release_freeze_receipt'] = {
              'path': 'release-freeze-verification.json',
              'sha256': hashlib.sha256(freeze).hexdigest(),
              'size': len(freeze),
          }
          anchor = (output / 'release-freeze-github-anchor.json').read_bytes()
          anchor_receipt = (
              output / 'release-freeze-github-anchor-receipt.json'
          ).read_bytes()
          control['release_freeze_github_anchor'] = {
              'snapshot_path': 'release-freeze-github-anchor.json',
              'snapshot_sha256': hashlib.sha256(anchor).hexdigest(),
              'snapshot_size': len(anchor),
              'receipt_path': 'release-freeze-github-anchor-receipt.json',
              'receipt_sha256': hashlib.sha256(anchor_receipt).hexdigest(),
              'receipt_size': len(anchor_receipt),
          }
          (output / 'control.json').write_text(
              json.dumps(control, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8', newline='\n',
          )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evoguard-signed-source-promotion-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-source-preflight
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  promote:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: evoguard-release-source-promotion
    outputs:
      post_capture_outcome: ${{ steps.post_capture.outcome }}
      post_validate_outcome: ${{ steps.post_validate.outcome }}
      post_upload_outcome: ${{ steps.post_upload.outcome }}
      active_snapshot_sha256: ${{ steps.active_evidence.outputs.snapshot_sha256 }}
      active_snapshot_size: ${{ steps.active_evidence.outputs.snapshot_size }}
      active_receipt_sha256: ${{ steps.active_evidence.outputs.receipt_sha256 }}
      active_receipt_size: ${{ steps.active_evidence.outputs.receipt_size }}
      active_upload_outcome: ${{ steps.active_upload.outcome }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Download only this attempt's preflight evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evoguard-signed-source-promotion-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion

      - name: Rebind main, exact PR head approval, checks, and GitHub signature
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
          FREEZE_DECLARATION_SHA: ${{ needs.preflight.outputs.base_sha }}
          FREEZE_DECLARATION_TREE_SHA: ${{ needs.preflight.outputs.base_tree_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data;
            if (branch.protected !== true || branch.commit.sha !== process.env.BASE_SHA ||
                process.env.GITHUB_SHA !== process.env.BASE_SHA ||
                process.env.GITHUB_WORKFLOW_SHA !== process.env.BASE_SHA ||
                process.env.FREEZE_DECLARATION_SHA !== process.env.BASE_SHA) {
              throw new Error('protected main or trusted workflow moved during approval');
            }
            const base = (await github.rest.git.getCommit({
              owner, repo, commit_sha: process.env.BASE_SHA,
            })).data;
            if (base.tree?.sha !== process.env.FREEZE_DECLARATION_TREE_SHA) {
              throw new Error('freeze declaration tree changed during approval');
            }
            const candidate = (await github.rest.repos.getCommit({
              owner, repo, ref: process.env.CANDIDATE_SHA,
            })).data;
            if (!Array.isArray(candidate.parents) || candidate.parents.length !== 1 ||
                candidate.parents[0].sha !== process.env.BASE_SHA ||
                candidate.commit?.verification?.verified !== true ||
                candidate.commit.verification.reason !== 'valid' ||
                !candidate.commit.verification.signature ||
                !candidate.commit.verification.payload ||
                candidate.author?.login !== 'EvoRiseKsa' || candidate.author?.id !== 231647061 ||
                candidate.committer?.login !== 'EvoRiseKsa' || candidate.committer?.id !== 231647061) {
              throw new Error('candidate identity or GitHub signature changed during approval');
            }
            const pull_number = Number(process.env.PR_NUMBER);
            const pr = (await github.rest.pulls.get({owner, repo, pull_number})).data;
            if (pr.state !== 'open' || pr.draft === true || pr.base?.ref !== 'main' ||
                pr.base?.sha !== process.env.BASE_SHA ||
                pr.head?.sha !== process.env.CANDIDATE_SHA ||
                pr.head?.repo?.full_name !== `${owner}/${repo}`) {
              throw new Error('exact candidate PR changed during approval');
            }
            const reviews = await github.paginate(
              github.rest.pulls.listReviews, {owner, repo, pull_number, per_page: 100}
            );
            const exact = reviews
              .filter(item => item.user?.login === 'MANA-awam' && item.user?.id === 304223352)
              .sort((left, right) => Number(left.id) - Number(right.id)).at(-1);
            if (!exact || exact.state !== 'APPROVED' ||
                exact.commit_id !== process.env.CANDIDATE_SHA) {
              throw new Error('exact-head approval changed during environment approval');
            }
            let cursor = null;
            let threadCount = 0;
            do {
              const result = await github.graphql(`
                query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      reviewDecision
                      mergeStateStatus
                      headRefOid
                      baseRefOid
                      reviewThreads(first:100, after:$cursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`, {owner, repo, number: pull_number, cursor});
              const threads = result.repository?.pullRequest?.reviewThreads;
              const decision = result.repository?.pullRequest;
              if (decision?.reviewDecision !== 'APPROVED' ||
                  decision?.mergeStateStatus !== 'CLEAN' ||
                  decision?.headRefOid !== process.env.CANDIDATE_SHA ||
                  decision?.baseRefOid !== process.env.BASE_SHA) {
                throw new Error('exact PR is no longer globally approved and clean');
              }
              if (!threads || !Array.isArray(threads.nodes)) {
                throw new Error('review-thread state changed during approval');
              }
              threadCount += threads.nodes.length;
              if (threadCount > 1000 || threads.nodes.some(item => item.isResolved !== true)) {
                throw new Error('unresolved or unbounded review threads appeared during approval');
              }
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              if (threads.pageInfo.hasNextPage && !cursor) {
                throw new Error('review-thread pagination became incomplete');
              }
            } while (cursor);
            const required = new Map([
              ['test (3.10)', 15368], ['test (3.11)', 15368],
              ['test (3.12)', 15368], ['e2e-runners', 15368],
              ['blackbox-docker-e2e', 15368], ['smoke', 15368],
              ['analyze', 15368], ['CodeQL', 57789], ['project-status', 15368],
              ['fuzz (address)', 15368], ['fuzz (undefined)', 15368],
            ]);
            const checks = await github.paginate(
              github.rest.checks.listForRef,
              {owner, repo, ref: process.env.CANDIDATE_SHA, per_page: 100, filter: 'latest'}
            );
            for (const [name, appId] of required) {
              const matches = checks.filter(item => item.name === name && item.app?.id === appId);
              if (matches.length !== 1 || matches[0].status !== 'completed' ||
                  matches[0].conclusion !== 'success' ||
                  matches[0].head_sha !== process.env.CANDIDATE_SHA) {
                throw new Error(`required check changed during approval: ${name}`);
              }
            }

