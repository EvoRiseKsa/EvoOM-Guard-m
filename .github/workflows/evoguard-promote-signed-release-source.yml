            ${{ runner.temp }}/post-push-source-protection.json
            ${{ runner.temp }}/post-push-source-protection-receipt.json
            ${{ runner.temp }}/source-promotion-push.txt
            ${{ runner.temp }}/source-promotion-mutation.json
            ${{ runner.temp }}/final-release-freeze-github-anchor.json
            ${{ runner.temp }}/final-release-freeze-github-anchor-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  prove-source-authority-retired:
    needs: [preflight, promote]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: evoguard-release-source-retirement
    permissions:
      actions: read
      contents: read
    outputs:
      promotion_completed: ${{ steps.retired_main.outputs.promotion_completed }}
    steps:
      - name: Check out the frozen workflow revision only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: base

      - name: Download the exact current-run source-active authority artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evoguard-signed-source-active-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-active

      - id: active_authority
        name: Verify and bind the downloaded source-active authority identity
        env:
          ARTIFACT: ${{ runner.temp }}/source-active
          ACTIVE_UPLOAD_OUTCOME: ${{ needs.promote.outputs.active_upload_outcome }}
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.promote.outputs.active_snapshot_sha256 }}
          EXPECTED_SNAPSHOT_SIZE: ${{ needs.promote.outputs.active_snapshot_size }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.promote.outputs.active_receipt_sha256 }}
          EXPECTED_RECEIPT_SIZE: ${{ needs.promote.outputs.active_receipt_size }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          EXPECTED_MAIN_RULESET_ID: ${{ needs.preflight.outputs.main_ruleset_id }}
          EXPECTED_SOURCE_DEPLOY_KEY_ID: ${{ needs.preflight.outputs.source_deploy_key_id }}
          EXPECTED_SOURCE_DEPLOY_KEY_FINGERPRINT: ${{ needs.preflight.outputs.source_deploy_key_fingerprint }}
        run: |
          set -euo pipefail
          test "$ACTIVE_UPLOAD_OUTCOME" = success
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat

          root = pathlib.Path(os.environ['ARTIFACT'])
          expected_names = {
              'source-authority-active.json',
              'source-authority-active-receipt.json',
          }
          if {item.name for item in root.iterdir()} != expected_names:
              raise SystemExit('source-active artifact inventory is not exact')
          paths = {name: root / name for name in expected_names}
          values = {}
          for name, path in paths.items():
              metadata = path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f'unsafe source-active artifact member: {name}')
              values[name] = path.read_bytes()
          snapshot = values['source-authority-active.json']
          receipt_raw = values['source-authority-active-receipt.json']
          expected = {
              'snapshot': (
                  os.environ['EXPECTED_SNAPSHOT_SHA256'],
                  os.environ['EXPECTED_SNAPSHOT_SIZE'],
                  snapshot,
              ),
              'receipt': (
                  os.environ['EXPECTED_RECEIPT_SHA256'],
                  os.environ['EXPECTED_RECEIPT_SIZE'],
                  receipt_raw,
              ),
          }
          for label, (digest, size, raw) in expected.items():
              if (
                  re.fullmatch(r'[0-9a-f]{64}', digest or '') is None
                  or re.fullmatch(r'[1-9][0-9]*', size or '') is None
                  or hashlib.sha256(raw).hexdigest() != digest
                  or len(raw) != int(size)
              ):
                  raise SystemExit(f'source-active {label} descriptor mismatch')
          receipt = json.loads(receipt_raw)
          authority = receipt.get('main_authority')
          authority_members = {
              'authority_state', 'main_sha',
              'classic_branch_protection_absent', 'ruleset_id',
              'ruleset_target', 'ruleset_enforcement', 'sole_bypass_actor',
              'deploy_key_id', 'deploy_key_fingerprint',
              'retired_deploy_key_id', 'retired_deploy_key_fingerprint',
              'enabled_write_deploy_key_count',
          }
          ruleset_id = int(os.environ['EXPECTED_MAIN_RULESET_ID'])
          deploy_key_id = int(os.environ['EXPECTED_SOURCE_DEPLOY_KEY_ID'])
          fingerprint = os.environ['EXPECTED_SOURCE_DEPLOY_KEY_FINGERPRINT']
          if (
              receipt.get('format')
              != 'EVOGUARD_RELEASE_SOURCE_PROTECTION_VERIFICATION_V1'
              or receipt.get('verdict') != 'PASS'
              or receipt.get('snapshot_sha256') != hashlib.sha256(snapshot).hexdigest()
              or not isinstance(authority, dict)
              or set(authority) != authority_members
              or authority.get('authority_state') != 'source-active'
              or authority.get('main_sha') != os.environ['EXPECTED_BASE_SHA']
              or type(authority.get('ruleset_id')) is not int
              or authority.get('ruleset_id') != ruleset_id
              or authority.get('sole_bypass_actor') != 'DeployKey'
              or type(authority.get('deploy_key_id')) is not int
              or authority.get('deploy_key_id') != deploy_key_id
              or authority.get('deploy_key_fingerprint') != fingerprint
              or authority.get('retired_deploy_key_id') is not None
              or authority.get('retired_deploy_key_fingerprint') is not None
              or type(authority.get('enabled_write_deploy_key_count')) is not int
              or authority.get('enabled_write_deploy_key_count') != 1
          ):
              raise SystemExit('source-active authority identity is not exact')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open(
              'a', encoding='utf-8', newline='\n'
          ) as output:
              output.write(f'main_ruleset_id={ruleset_id}\n')
              output.write(f'source_deploy_key_id={deploy_key_id}\n')
              output.write(f'source_deploy_key_fingerprint={fingerprint}\n')
          PY

      - name: Capture source authority after operator retirement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT_PATH: ${{ runner.temp }}/source-authority-retired.json
          EXPECTED_RULESET_ID: ${{ steps.active_authority.outputs.main_ruleset_id }}
        with:
          github-token: ${{ secrets.EVOGUARD_RELEASE_SOURCE_CONTROL_PLANE_TOKEN }}
          script: |
            const capture = require(
              `${process.env.GITHUB_WORKSPACE}/base/tools/ci/capture_release_source_protection.js`
            );
            await capture({
              github,
              context,
              outputPath: process.env.OUTPUT_PATH,
              expectedRulesetId: process.env.EXPECTED_RULESET_ID,
            });

      - id: retired_main
        name: Bind the post-attempt main SHA before validating retirement
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          SNAPSHOT: ${{ runner.temp }}/source-authority-retired.json
        run: |
          set -euo pipefail
          observed="$(jq -er '.main_branch.sha | select(type == "string")' "$SNAPSHOT")"
          [[ "$observed" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          case "$observed" in
            "$CANDIDATE_SHA") promotion_completed=true ;;
            "$BASE_SHA") promotion_completed=false ;;
            *)
              echo 'main is neither the exact promotion base nor candidate at retirement' >&2
              exit 1
              ;;
          esac
          printf 'main_sha=%s\n' "$observed" >> "$GITHUB_OUTPUT"
          printf 'promotion_completed=%s\n' "$promotion_completed" >> "$GITHUB_OUTPUT"

      - name: Prove source deploy key and generic main bypass are retired
        env:
          OBSERVED_MAIN_SHA: ${{ steps.retired_main.outputs.main_sha }}
          EXPECTED_RULESET_ID: ${{ steps.active_authority.outputs.main_ruleset_id }}
          RETIRED_DEPLOY_KEY_ID: ${{ steps.active_authority.outputs.source_deploy_key_id }}
          RETIRED_DEPLOY_KEY_FINGERPRINT: ${{ steps.active_authority.outputs.source_deploy_key_fingerprint }}
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/base/tools/ci/validate_release_source_protection.py" \
            --snapshot "$RUNNER_TEMP/source-authority-retired.json" \
            --authority-state source-retired \
            --expected-repository "EvoRiseKsa/EvoOM-Guard-m" \
            --expected-repository-id "$GITHUB_REPOSITORY_ID" \
            --expected-main-sha "$OBSERVED_MAIN_SHA" \
            --expected-ruleset-id "$EXPECTED_RULESET_ID" \
            --expected-deploy-key-id "$RETIRED_DEPLOY_KEY_ID" \
            --expected-deploy-key-fingerprint "$RETIRED_DEPLOY_KEY_FINGERPRINT" \
            --receipt "$RUNNER_TEMP/source-authority-retired-receipt.json"

      - name: Assemble the terminal source-authority closure receipt
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          OBSERVED_MAIN_SHA: ${{ steps.retired_main.outputs.main_sha }}
          PROMOTION_COMPLETED: ${{ steps.retired_main.outputs.promotion_completed }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
          MAIN_RULESET_ID: ${{ steps.active_authority.outputs.main_ruleset_id }}
          SOURCE_DEPLOY_KEY_ID: ${{ steps.active_authority.outputs.source_deploy_key_id }}
          SOURCE_DEPLOY_KEY_FINGERPRINT: ${{ steps.active_authority.outputs.source_deploy_key_fingerprint }}
          ACTIVE_SNAPSHOT: ${{ runner.temp }}/source-active/source-authority-active.json
          ACTIVE_VERIFICATION: ${{ runner.temp }}/source-active/source-authority-active-receipt.json
          RETIRED_SNAPSHOT: ${{ runner.temp }}/source-authority-retired.json
          RETIRED_VERIFICATION: ${{ runner.temp }}/source-authority-retired-receipt.json
          OUTPUT_DIRECTORY: ${{ runner.temp }}/source-authority-retirement
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          def descriptor(path: Path) -> dict[str, object]:
              raw = path.read_bytes()
              return {'sha256': hashlib.sha256(raw).hexdigest(), 'size': len(raw)}

          active_snapshot = Path(os.environ['ACTIVE_SNAPSHOT'])
          active_verification = Path(os.environ['ACTIVE_VERIFICATION'])
          retired_snapshot = Path(os.environ['RETIRED_SNAPSHOT'])
          retired_verification = Path(os.environ['RETIRED_VERIFICATION'])
          active_receipt = json.loads(
              active_verification.read_text(encoding='utf-8')
          )
          retired_receipt = json.loads(
              retired_verification.read_text(encoding='utf-8')
          )
          active_authority = active_receipt.get('main_authority')
          retired_authority = retired_receipt.get('main_authority')
          authority_members = {
              'authority_state', 'main_sha',
              'classic_branch_protection_absent', 'ruleset_id',
              'ruleset_target', 'ruleset_enforcement', 'sole_bypass_actor',
              'deploy_key_id', 'deploy_key_fingerprint',
              'retired_deploy_key_id', 'retired_deploy_key_fingerprint',
              'enabled_write_deploy_key_count',
          }
          if (
              not isinstance(active_authority, dict)
              or set(active_authority) != authority_members
              or not isinstance(retired_authority, dict)
              or set(retired_authority) != authority_members
          ):
              raise SystemExit('source authority receipt inventory is not exact')
          ruleset_id = int(os.environ['MAIN_RULESET_ID'])
          source_key_id = int(os.environ['SOURCE_DEPLOY_KEY_ID'])
          source_fingerprint = os.environ['SOURCE_DEPLOY_KEY_FINGERPRINT']
          promotion_text = os.environ['PROMOTION_COMPLETED']
          if promotion_text not in {'true', 'false'}:
              raise SystemExit('promotion completion state is not an exact boolean output')
          promotion_completed = promotion_text == 'true'
          expected_terminal_sha = (
              os.environ['CANDIDATE_SHA']
              if promotion_completed
              else os.environ['BASE_SHA']
          )
          if (
              re.fullmatch(r'SHA256:[A-Za-z0-9+/]{43}', source_fingerprint) is None
              or active_authority.get('authority_state') != 'source-active'
              or active_authority.get('main_sha') != os.environ['BASE_SHA']
              or type(active_authority.get('ruleset_id')) is not int
              or active_authority.get('ruleset_id') != ruleset_id
              or active_authority.get('sole_bypass_actor') != 'DeployKey'
              or type(active_authority.get('deploy_key_id')) is not int
              or active_authority.get('deploy_key_id') != source_key_id
              or active_authority.get('deploy_key_fingerprint') != source_fingerprint
              or active_authority.get('retired_deploy_key_id') is not None
              or active_authority.get('retired_deploy_key_fingerprint') is not None
              or type(active_authority.get('enabled_write_deploy_key_count')) is not int
              or active_authority.get('enabled_write_deploy_key_count') != 1
              or retired_authority.get('authority_state') != 'source-retired'
              or retired_authority.get('main_sha') != expected_terminal_sha
              or type(retired_authority.get('ruleset_id')) is not int
              or retired_authority.get('ruleset_id') != ruleset_id
              or retired_authority.get('sole_bypass_actor') is not None
              or retired_authority.get('deploy_key_id') is not None
              or retired_authority.get('deploy_key_fingerprint') is not None
              or type(retired_authority.get('retired_deploy_key_id')) is not int
              or retired_authority.get('retired_deploy_key_id') != source_key_id
              or retired_authority.get('retired_deploy_key_fingerprint')
                 != source_fingerprint
              or type(retired_authority.get('enabled_write_deploy_key_count')) is not int
              or retired_authority.get('enabled_write_deploy_key_count') != 0
              or os.environ['OBSERVED_MAIN_SHA'] != expected_terminal_sha
          ):
              raise SystemExit('active/retired source authority identity is invalid')

          receipt = {
              'format': 'EVOGUARD_SIGNED_SOURCE_AUTHORITY_CLOSURE_V1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'base_sha': os.environ['BASE_SHA'],
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'pull_request_number': int(os.environ['PR_NUMBER']),
              'main_sha_after_attempt': os.environ['OBSERVED_MAIN_SHA'],
              'promotion_completed': promotion_completed,
              'main_ruleset_id': ruleset_id,
              'source_deploy_key_id': source_key_id,
              'source_deploy_key_fingerprint': source_fingerprint,
              'retired_source_deploy_key_id': source_key_id,
              'retired_source_deploy_key_fingerprint': source_fingerprint,
              'source_deploy_key_absent': True,
              'main_deploy_key_bypass_absent': True,
              'active_snapshot': descriptor(active_snapshot),
              'active_verification': descriptor(active_verification),
              'retired_snapshot': descriptor(retired_snapshot),
              'retired_verification': descriptor(retired_verification),
              'boundary': {
                  'github_control_plane_point_in_time': True,
                  'private_key_erasure_claimed': False,
                  'future_non_readdition_claimed': False,
              },
          }
          output_directory = Path(os.environ['OUTPUT_DIRECTORY'])
          output_directory.mkdir(mode=0o700)
          for source in (
              active_snapshot,
              active_verification,
              retired_snapshot,
              retired_verification,
          ):
              shutil.copyfile(source, output_directory / source.name)
          output = output_directory / 'source-authority-closure.json'
          with output.open('x', encoding='utf-8', newline='\n') as handle:
              json.dump(receipt, handle, sort_keys=True, separators=(',', ':'), allow_nan=False)
              handle.write('\n')
          PY

      - name: Fail closed on the complete active-to-retired artifact contract
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/base/tools/ci/validate_release_source_retirement_artifact.py" \
            --artifact "$RUNNER_TEMP/source-authority-retirement" \
            --expected-repository "EvoRiseKsa/EvoOM-Guard-m" \
            --expected-repository-id "$GITHUB_REPOSITORY_ID" \
            --expected-base-sha "${{ needs.preflight.outputs.base_sha }}" \
            --expected-candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --expected-promotion-run-id "$GITHUB_RUN_ID" \
            --expected-promotion-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --allow-unpromoted-terminal-closure \
            --binding-out "$RUNNER_TEMP/source-retirement-binding.json"

      - name: Upload closed source-authority retirement evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evoguard-signed-source-retirement-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-authority-retirement/source-authority-active.json
            ${{ runner.temp }}/source-authority-retirement/source-authority-active-receipt.json
            ${{ runner.temp }}/source-authority-retirement/source-authority-retired.json
            ${{ runner.temp }}/source-authority-retirement/source-authority-retired-receipt.json
            ${{ runner.temp }}/source-authority-retirement/source-authority-closure.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  enforce-source-promotion-closure:
    needs: [promote, prove-source-authority-retired]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require complete post-push evidence and terminal authority retirement
        env:
          PROMOTE_RESULT: ${{ needs.promote.result }}
          RETIREMENT_RESULT: ${{ needs.prove-source-authority-retired.result }}
          PROMOTION_COMPLETED: ${{ needs.prove-source-authority-retired.outputs.promotion_completed }}
          POST_CAPTURE_OUTCOME: ${{ needs.promote.outputs.post_capture_outcome }}
          POST_VALIDATE_OUTCOME: ${{ needs.promote.outputs.post_validate_outcome }}
          POST_UPLOAD_OUTCOME: ${{ needs.promote.outputs.post_upload_outcome }}
          ACTIVE_UPLOAD_OUTCOME: ${{ needs.promote.outputs.active_upload_outcome }}
        run: |
          set -euo pipefail
          test "$PROMOTE_RESULT" = success
          test "$RETIREMENT_RESULT" = success
          test "$PROMOTION_COMPLETED" = true
          test "$POST_CAPTURE_OUTCOME" = success
          test "$POST_VALIDATE_OUTCOME" = success
          test "$POST_UPLOAD_OUTCOME" = success
          test "$ACTIVE_UPLOAD_OUTCOME" = success
          printf '%s\n' 'signed source promotion closed with complete post-push evidence and retired transport authority'
