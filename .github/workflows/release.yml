# ─────────────────────────────────────────────────────────────────────────────
# The official release path. A maintainer dispatches this workflow manually
# with the release tag; nothing here is gated on dates, elapsed time, or
# stabilization windows. Policy: time-based release gates are abolished
# (see docs/GOVERNANCE.md).
#
# The pipeline validates the requested tag against `evoom_guard.__version__`,
# runs lint/type/test plus Linux and Windows end-to-end checks, builds the
# reproducible `evo-guard.pyz` and SPDX SBOM with checksums, attests the
# assets, prepares a DRAFT release, and pauses at a second protected
# Environment. A reviewer approves the state transition; the final job then
# revalidates the live authorities and exact bytes immediately before
# publication and proves the resulting release immutable.
#
# The workflow is manual-only and its jobs accept the default branch only.
# A push to an unprotected release/* branch must never receive the contents:write
# token used to create a draft release.
#
# These job-level ref guards assume this reviewed workflow definition is
# intact. They are not an external trust root against a maintainer who can
# alter a workflow on the ref selected for workflow_dispatch.
#
# The archived A-H signed lane (evoguard-*-release-*.yml) remains inert with
# all activation flags false; it is a design reference, not a release path.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must equal 'v' + evoom_guard.__version__)"
        required: true

# Every permission is declared at the narrowest possible scope below. This
# prevents a future job from inheriting a repository-wide write token by
# accident; only prepare-draft and publish-release need contents:write.
permissions: {}

# Never cancel an earlier release run: cancellation after uploading one asset
# would leave an incomplete draft that a later run must audit before mutation.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch-ref-guard:
    # A wrong-ref manual dispatch must be visibly red, never an all-skipped
    # green run. This check carries no repository permission or candidate
    # execution and does not replace the per-job token guards below.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Reject a non-default-branch dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo '::error::release_dispatch_requires_default_branch'
            exit 1
          }

  validate-test:
    # A wrong-ref dispatch is rejected above; every privileged or
    # candidate-executing job also remains independently guarded.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the provenance-ancestry and failure-registry tests
          # verify source-to-evidence commit ancestry, which a shallow
          # checkout cannot prove.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the requested tag
        id: resolve-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$DISPATCH_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::invalid_release_tag: expected canonical vMAJOR.MINOR.PATCH, got '$TAG'"
            exit 2
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          echo "releasing $TAG from $GITHUB_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version matches the requested tag
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          V="$(python -c 'import evoom_guard; print(evoom_guard.__version__)')"
          echo "package=$V tag=$TAG"
          test "v$V" = "$TAG"

      - name: Lint (Ruff)
        run: >-
          python -m ruff check
          evoom_guard/ tests/
          ops/build_pyz.py ops/generate_spdx_sbom.py

      - name: Type-check (Mypy)
        run: python -m mypy evoom_guard/

      - name: Type-check release tooling (Mypy strict)
        run: >-
          python -m mypy --strict
          ops/build_pyz.py ops/generate_spdx_sbom.py

      - name: Type-check domain contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/domain/

      - name: Type-check application contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/application/

      - name: Type-check candidate contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/candidate/

      - name: Type-check workspace contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/workspace/

      - name: Type-check policy contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/policy/

      - name: Tests must be green before a release
        run: python -m pytest tests/ -q

  release-e2e:
    # Re-run the two integration boundaries for the manually selected default
    # branch; the write-capable job cannot run before these complete.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same immutable OCI index as CI's Docker proof.
      EVOGUARD_E2E_IMAGE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install integration-test dependencies
        run: |
          npm ci --ignore-scripts --prefix tools/ci-vitest
          echo "${GITHUB_WORKSPACE}/tools/ci-vitest/node_modules/.bin" >> "$GITHUB_PATH"
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: E2E — vitest and node:test oracles
        run: python -m pytest tests/test_vitest_oracle.py tests/test_node_oracle.py -v
      - name: Sanity — a real Docker daemon is present
        run: docker version
      - name: Prepare pinned runner dependencies
        run: |
          docker pull "$EVOGUARD_E2E_IMAGE"
          docker build --build-arg PYTHON_IMAGE="$EVOGUARD_E2E_IMAGE" \
            --tag evoguard-e2e-pytest:local \
            --file ops/ci/docker/evoguard-e2e-pytest.Dockerfile .
      - name: Docker E2E — the candidate must be confined
        env:
          EVOGUARD_E2E_PYTEST_IMAGE: evoguard-e2e-pytest:local
        run: >-
          python -m pytest tests/test_blackbox_docker_e2e.py
          tests/test_docker_isolation.py::test_docker_setup_suite_and_pack_e2e -v

  release-windows-e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned runner and test dependencies
        run: |
          npm ci --ignore-scripts --prefix tools/ci-vitest
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\tools\ci-vitest\node_modules\.bin"
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Windows E2E — native runner and baseline command resolution
        run: python -m pytest tests/test_vitest_oracle.py tests/test_node_oracle.py -v

  build-artifact:
    needs: [validate-test, release-e2e, release-windows-e2e]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-artifact-digest: ${{ steps.upload-release-assets.outputs.artifact-digest }}
      release-artifact-id: ${{ steps.upload-release-assets.outputs.artifact-id }}
    permissions:
      # Candidate code and the built zipapp execute only in this unprivileged
      # job. Provider identity and attestation permissions belong to the
      # separate clean job below.
      contents: read
    env:
      TAG: ${{ needs.validate-test.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build evo-guard.pyz in a clean dependency-free job
        run: python -I ops/build_pyz.py -o dist/evo-guard.pyz

      - name: Smoke-test the artifact
        run: |
          test "$(python -I dist/evo-guard.pyz version)" = "evo-guard ${TAG#v}"
          python -I dist/evo-guard.pyz doctor

      - name: Generate the deterministic external SPDX 2.3 inventory
        run: |
          CREATED="$(git show -s --format=%cI "$GITHUB_SHA")"
          python -I ops/generate_spdx_sbom.py dist/evo-guard.pyz \
            --version "${TAG#v}" \
            --created "$CREATED" \
            --output dist/evo-guard.spdx.json

      - name: Checksums (release integrity)
        run: |
          ( cd dist && \
            sha256sum evo-guard.pyz evo-guard.spdx.json > SHA256SUMS && \
            cat SHA256SUMS )

      - name: Transfer the generated release assets
        id: upload-release-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |
            dist/evo-guard.pyz
            dist/evo-guard.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true

  attest-release-assets:
    needs: [validate-test, build-artifact]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      approved-artifact-digest: ${{ steps.approve-artifact.outputs.artifact-digest }}
      approved-artifact-id: ${{ steps.approve-artifact.outputs.artifact-id }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.validate-test.outputs.tag }}
    steps:
      - name: Validate the generated artifact identity
        env:
          ARTIFACT_DIGEST: ${{ needs.build-artifact.outputs.release-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-artifact.outputs.release-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      # This job deliberately has no checkout, setup, dependency installation,
      # project-script execution, or zipapp execution. It receives only the
      # immutable artifact created by the unprivileged build job.
      - name: Receive the generated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-artifact.outputs.release-artifact-id }}
          digest-mismatch: error
          path: dist

      - name: Bind the transferred SBOM and checksums to the exact zipapp
        run: |
          set -euo pipefail
          EXPECTED_ENTRIES="$(printf 'f\t%s\n' \
            SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
          ACTUAL_ENTRIES="$(find dist -mindepth 1 -maxdepth 1 \
            -printf '%y\t%f\n' | LC_ALL=C sort)"
          if [ "$ACTUAL_ENTRIES" != "$EXPECTED_ENTRIES" ]; then
            echo "::error::release_asset_set_mismatch: attestation input set is not exact"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ENTRIES" "$ACTUAL_ENTRIES"
            exit 1
          fi
          PYZ_BYTES="$(stat -c '%s' dist/evo-guard.pyz)"
          SBOM_BYTES="$(stat -c '%s' dist/evo-guard.spdx.json)"
          CHECKSUM_BYTES="$(stat -c '%s' dist/SHA256SUMS)"
          if [ "$PYZ_BYTES" -lt 1 ] || [ "$PYZ_BYTES" -gt 67108864 ] || \
             [ "$SBOM_BYTES" -lt 1 ] || [ "$SBOM_BYTES" -gt 16777216 ] || \
             [ "$CHECKSUM_BYTES" -lt 1 ] || [ "$CHECKSUM_BYTES" -gt 512 ]; then
            echo "::error::release_asset_size_invalid: attestation inputs exceed bounded sizes"
            exit 1
          fi
          if [ "$(wc -l < dist/SHA256SUMS)" -ne 2 ] || \
             ! sed -n '1p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.pyz$' || \
             ! sed -n '2p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.spdx\.json$'; then
            echo "::error::release_checksum_format_invalid: SHA256SUMS must contain exactly two filename-ordered digests"
            exit 1
          fi
          ( cd dist && sha256sum -c SHA256SUMS )

          EXPECTED_VERSION="${TAG#v}" python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite JSON constant: {value}")

          sbom_path = Path("dist/evo-guard.spdx.json")
          with sbom_path.open("r", encoding="utf-8") as stream:
              document = json.load(
                  stream,
                  object_pairs_hook=unique_object,
                  parse_constant=reject_constant,
              )
          packages = document.get("packages")
          if not isinstance(packages, list) or len(packages) != 1:
              raise SystemExit("expected exactly one SPDX package")
          package = packages[0]
          expected_fields = {
              "SPDXID": "SPDXRef-Package-evoom-guard",
              "name": "evo-guard",
              "packageFileName": "evo-guard.pyz",
              "versionInfo": os.environ["EXPECTED_VERSION"],
          }
          for field, expected in expected_fields.items():
              if package.get(field) != expected:
                  raise SystemExit(f"unexpected SPDX package {field}")
          checksums = package.get("checksums")
          if not isinstance(checksums, list):
              raise SystemExit("missing SPDX package checksums")
          sha256_values = [
              entry.get("checksumValue")
              for entry in checksums
              if isinstance(entry, dict) and entry.get("algorithm") == "SHA256"
          ]
          if len(sha256_values) != 1:
              raise SystemExit("expected exactly one SPDX package SHA256")
          digest = hashlib.sha256()
          with Path("dist/evo-guard.pyz").open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          if sha256_values[0] != digest.hexdigest():
              raise SystemExit(
                  "sbom_subject_digest_mismatch: SPDX package SHA256 "
                  "does not bind the transferred zipapp"
              )
          PY

      # These are provider attestations for the exact transferred files, not
      # release admission, a vulnerability result, or an EvoGuard verdict.
      - name: Generate GitHub build provenance for the exact artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/evo-guard.pyz

      - name: Generate GitHub SBOM attestation for the exact artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/evo-guard.pyz
          sbom-path: dist/evo-guard.spdx.json

      - name: Approve the exact artifact identity for publication
        id: approve-artifact
        env:
          ARTIFACT_DIGEST: ${{ needs.build-artifact.outputs.release-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-artifact.outputs.release-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact-id=%s\n' "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          printf 'artifact-digest=%s\n' "$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  prepare-draft:
    needs: [validate-test, attest-release-assets]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: evoguard-release-draft
    outputs:
      release-id: ${{ steps.prepare-release.outputs.release-id }}
      release-body-sha256: ${{ steps.prepare-release.outputs.release-body-sha256 }}
      tag-object-sha: ${{ steps.release-authority.outputs.tag-object-sha }}
      pyz-sha256: ${{ steps.prepare-release.outputs.pyz-sha256 }}
      pyz-size: ${{ steps.prepare-release.outputs.pyz-size }}
      sbom-sha256: ${{ steps.prepare-release.outputs.sbom-sha256 }}
      sbom-size: ${{ steps.prepare-release.outputs.sbom-size }}
      sums-sha256: ${{ steps.prepare-release.outputs.sums-sha256 }}
      sums-size: ${{ steps.prepare-release.outputs.sums-size }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate-test.outputs.tag }}
    steps:
      - name: Validate the approved artifact identity
        env:
          ARTIFACT_DIGEST: ${{ needs.attest-release-assets.outputs.approved-artifact-digest }}
          ARTIFACT_ID: ${{ needs.attest-release-assets.outputs.approved-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      # This token is read-only and belongs only to the protected draft
      # Environment. The job receives no source checkout and executes no
      # candidate bytes. Every state check is repeated immediately before the
      # first release mutation; a changed state fails now, never after a wait.
      - name: Require current signed source and live immutable-release authority
        id: release-authority
        env:
          CONTROL_PLANE_TOKEN: ${{ secrets.EVOGUARD_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_TOKEN:-}" ]; then
            echo "::error::immutable_release_control_token_missing"
            exit 1
          fi

          api() {
            GH_TOKEN="$CONTROL_PLANE_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$1"
          }

          IMMUTABILITY_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/immutable-releases")"
          if ! jq -e \
            '.enabled == true and (.enforced_by_owner | type == "boolean")' \
            <<<"$IMMUTABILITY_JSON" >/dev/null; then
            echo "::error::immutable_releases_required"
            exit 1
          fi

          MAIN_REF_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          if ! jq -e \
            '.object.type == "commit" and (.object.sha | test("^[0-9a-f]{40}$"))' \
            <<<"$MAIN_REF_JSON" >/dev/null; then
            echo "::error::release_main_ref_invalid"
            exit 1
          fi
          MAIN_BRANCH_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/branches/main")"
          MAIN_HEAD_SHA="$(jq -r '.object.sha' <<<"$MAIN_REF_JSON")"
          if ! jq -e --arg head "$MAIN_HEAD_SHA" '
            .name == "main" and
            .protected == true and
            .commit.sha == $head
          ' <<<"$MAIN_BRANCH_JSON" >/dev/null; then
            echo "::error::release_source_not_protected_main"
            exit 1
          fi
          MAIN_COMPARE_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$MAIN_HEAD_SHA")"
          if ! jq -e --arg source "$GITHUB_SHA" '
            .base_commit.sha == $source and
            .merge_base_commit.sha == $source and
            (.status == "ahead" or .status == "identical") and
            .behind_by == 0 and
            ((.status == "identical" and .ahead_by == 0) or
             (.status == "ahead" and .ahead_by > 0))
          ' <<<"$MAIN_COMPARE_JSON" >/dev/null; then
            echo "::error::release_source_not_in_protected_main_history"
            exit 1
          fi

          SOURCE_COMMIT_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")"
          if ! jq -e --arg sha "$GITHUB_SHA" '
            .sha == $sha and
            .commit.verification.verified == true and
            .commit.verification.reason == "valid" and
            (.commit.verification.signature | type == "string") and
            (.commit.verification.payload | type == "string")
          ' <<<"$SOURCE_COMMIT_JSON" >/dev/null; then
            echo "::error::release_source_signature_invalid"
            exit 1
          fi

          # Protected main and GitHub verification establish the exact source
          # object. Maintainer authorization is the separately signed
          # annotated tag below; requiring the same local key on a GitHub-made
          # PR merge commit would make the protected PR path inoperable.
          ALLOWED_SIGNERS="$RUNNER_TEMP/evoguard-release-allowed-signers"
          printf '%s\n' \
            'EvoRiseKsa namespaces="git" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDZCepQbTxouwR5UwSKMF+4RvlK/MRQ+D9HE+fxJOKdi' \
            > "$ALLOWED_SIGNERS"

          if ! TAG_REF_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"; then
            echo "::error::signed_annotated_release_tag_required"
            exit 1
          fi
          if ! jq -e --arg ref "refs/tags/$TAG" '
            .ref == $ref and
            .object.type == "tag" and
            (.object.sha | type == "string") and
            (.object.sha | test("^[0-9a-f]{40}$"))
          ' <<<"$TAG_REF_JSON" >/dev/null; then
            echo "::error::signed_annotated_release_tag_required"
            exit 1
          fi
          TAG_OBJECT_SHA="$(jq -r .object.sha <<<"$TAG_REF_JSON")"
          TAG_OBJECT_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          if ! jq -e --arg tag "$TAG" --arg sha "$GITHUB_SHA" '
            .tag == $tag and
            .object.type == "commit" and
            .object.sha == $sha and
            .verification.verified == true and
            .verification.reason == "valid" and
            (.verification.signature | type == "string") and
            (.verification.payload | type == "string")
          ' <<<"$TAG_OBJECT_JSON" >/dev/null; then
            echo "::error::release_tag_signature_or_target_invalid"
            exit 1
          fi
          TAG_PAYLOAD="$RUNNER_TEMP/evoguard-release-tag.payload"
          TAG_SIGNATURE="$RUNNER_TEMP/evoguard-release-tag.signature"
          jq -j '.verification.payload' \
            <<<"$TAG_OBJECT_JSON" > "$TAG_PAYLOAD"
          jq -j '.verification.signature' \
            <<<"$TAG_OBJECT_JSON" > "$TAG_SIGNATURE"
          if ! ssh-keygen -Y verify -q \
            -f "$ALLOWED_SIGNERS" -I EvoRiseKsa -n git \
            -s "$TAG_SIGNATURE" < "$TAG_PAYLOAD"; then
            echo "::error::release_tag_not_signed_by_maintainer_root"
            exit 1
          fi
          printf 'tag-object-sha=%s\n' "$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"

          CHECKS_JSON="$(api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100")"
          if ! jq -e '
            .total_count <= 100 and
            .total_count == (.check_runs | length)
          ' <<<"$CHECKS_JSON" >/dev/null; then
            echo "::error::release_check_run_pagination_incomplete"
            exit 1
          fi
          EXPECTED_CHECKS="$(printf '%s\t%s\t%s\n' \
            'CodeQL' 57789 success \
            analyze 15368 success \
            blackbox-docker-e2e 15368 success \
            e2e-runners 15368 success \
            'fuzz (address)' 15368 success \
            'fuzz (undefined)' 15368 success \
            project-status 15368 success \
            smoke 15368 success \
            'test (3.10)' 15368 success \
            'test (3.11)' 15368 success \
            'test (3.12)' 15368 success | LC_ALL=C sort)"
          ACTUAL_CHECKS="$(jq -r --argjson expected '{
              "CodeQL": 57789,
              "analyze": 15368,
              "blackbox-docker-e2e": 15368,
              "e2e-runners": 15368,
              "fuzz (address)": 15368,
              "fuzz (undefined)": 15368,
              "project-status": 15368,
              "smoke": 15368,
              "test (3.10)": 15368,
              "test (3.11)": 15368,
              "test (3.12)": 15368
            }' '
              . as $document |
              $expected | to_entries[] | . as $required |
              ([
                $document.check_runs[] |
                select(
                  .name == $required.key and
                  .app.id == $required.value
                )
              ] | max_by(.id)) as $latest |
              if $latest == null then
                [$required.key, ($required.value | tostring), "missing"]
              else
                [$latest.name, ($latest.app.id | tostring),
                 ($latest.conclusion // "")]
              end | @tsv
            ' <<<"$CHECKS_JSON" | LC_ALL=C sort)"
          if [ "$ACTUAL_CHECKS" != "$EXPECTED_CHECKS" ]; then
            echo "::error::release_required_checks_drift"
            printf 'expected:\n%s\nactual:\n%s\n' \
              "$EXPECTED_CHECKS" "$ACTUAL_CHECKS"
            exit 1
          fi

      - name: Receive the verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.attest-release-assets.outputs.approved-artifact-id }}
          digest-mismatch: error
          path: dist

      - name: Verify the transferred asset set and checksum
        run: |
          set -euo pipefail
          EXPECTED_ENTRIES="$(printf 'f\t%s\n' \
            SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
          ACTUAL_ENTRIES="$(find dist -mindepth 1 -maxdepth 1 \
            -printf '%y\t%f\n' | LC_ALL=C sort)"
          if [ "$ACTUAL_ENTRIES" != "$EXPECTED_ENTRIES" ]; then
            echo "::error::release_asset_set_mismatch: transferred top-level name/type set is not exact"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ENTRIES" "$ACTUAL_ENTRIES"
            exit 1
          fi
          if [ "$(wc -l < dist/SHA256SUMS)" -ne 2 ] || \
             ! sed -n '1p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.pyz$' || \
             ! sed -n '2p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.spdx\.json$'; then
            echo "::error::release_checksum_format_invalid: SHA256SUMS must contain exactly two filename-ordered digests"
            exit 1
          fi
          ( cd dist && sha256sum -c SHA256SUMS )

      - name: Prepare the draft release and immutable asset set
        id: prepare-release
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_TOKEN: ${{ secrets.EVOGUARD_IMMUTABLE_RELEASES_READ_TOKEN }}
          EXPECTED_TAG_OBJECT_SHA: ${{ steps.release-authority.outputs.tag-object-sha }}
        run: |
          set -euo pipefail

          # Re-read every mutable authority input after asset verification and
          # immediately before the first write. Commit and annotated-tag
          # objects are content-addressed; their refs and all other live state
          # must still match the already-verified objects.
          control_api() {
            GH_TOKEN="$CONTROL_PLANE_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$1"
          }
          [[ "$EXPECTED_TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          verify_mutable_authority() {
            local immutability_json main_ref_json main_branch_json main_compare_json
            local main_head_sha
            local checks_json tag_ref_json
            immutability_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/immutable-releases")"
            jq -e \
              '.enabled == true and (.enforced_by_owner | type == "boolean")' \
              <<<"$immutability_json" >/dev/null || {
              echo "::error::immutable_releases_required"
              return 1
            }
            main_ref_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            jq -e \
              '.object.type == "commit" and (.object.sha | test("^[0-9a-f]{40}$"))' \
              <<<"$main_ref_json" >/dev/null || {
              echo "::error::release_main_ref_invalid"
              return 1
            }
            main_branch_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/branches/main")"
            main_head_sha="$(jq -r '.object.sha' <<<"$main_ref_json")"
            jq -e --arg head "$main_head_sha" '
              .name == "main" and
              .protected == true and
              .commit.sha == $head
            ' <<<"$main_branch_json" >/dev/null || {
              echo "::error::release_source_not_protected_main"
              return 1
            }
            main_compare_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main_head_sha")"
            jq -e --arg source "$GITHUB_SHA" '
              .base_commit.sha == $source and
              .merge_base_commit.sha == $source and
              (.status == "ahead" or .status == "identical") and
              .behind_by == 0 and
              ((.status == "identical" and .ahead_by == 0) or
               (.status == "ahead" and .ahead_by > 0))
            ' <<<"$main_compare_json" >/dev/null || {
              echo "::error::release_source_not_in_protected_main_history"
              return 1
            }
            checks_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100")"
            if ! jq -e '
              .total_count <= 100 and
              .total_count == (.check_runs | length)
            ' <<<"$checks_json" >/dev/null; then
              echo "::error::release_check_run_pagination_incomplete"
              return 1
            fi
            jq -e --argjson expected '{
                "CodeQL": 57789,
                "analyze": 15368,
                "blackbox-docker-e2e": 15368,
                "e2e-runners": 15368,
                "fuzz (address)": 15368,
                "fuzz (undefined)": 15368,
                "project-status": 15368,
                "smoke": 15368,
                "test (3.10)": 15368,
                "test (3.11)": 15368,
                "test (3.12)": 15368
              }' '
                . as $document |
                all($expected | to_entries[]; . as $required |
                  ([
                    $document.check_runs[] |
                    select(
                      .name == $required.key and
                      .app.id == $required.value
                    )
                  ] | max_by(.id)) as $latest |
                  $latest != null and $latest.conclusion == "success"
                )
              ' <<<"$checks_json" >/dev/null || {
              echo "::error::release_required_checks_drift"
              return 1
            }
            tag_ref_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            jq -e --arg ref "refs/tags/$TAG" \
              --arg object "$EXPECTED_TAG_OBJECT_SHA" '
              .ref == $ref and
              .object.type == "tag" and
              .object.sha == $object
            ' <<<"$tag_ref_json" >/dev/null || {
              echo "::error::release_tag_drift"
              return 1
            }
          }

          # A rerun must never retarget an existing tag/release or replace an
          # existing asset with bytes built from another commit.
          verify_mutable_authority

          set +e
          RELEASE_LOOKUP="$(gh api --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"
          RELEASE_LOOKUP_STATUS=$?
          set -e
          if [ "$RELEASE_LOOKUP_STATUS" -ne 0 ] && \
             ! grep -Eq '^HTTP/[^ ]+ 404 ' <<<"$RELEASE_LOOKUP"; then
            echo "::error::release_lookup_failed"
            printf '%s\n' "$RELEASE_LOOKUP" >&2
            exit "$RELEASE_LOOKUP_STATUS"
          fi
          if [ "$RELEASE_LOOKUP_STATUS" -ne 0 ]; then
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

          RELEASE_JSON="$(gh release view "$TAG" \
            --json assets,isDraft,isImmutable,tagName,targetCommitish)"
          RELEASE_TAG="$(jq -r .tagName <<<"$RELEASE_JSON")"
          RELEASE_TARGET="$(jq -r .targetCommitish <<<"$RELEASE_JSON")"
          RELEASE_IS_DRAFT="$(jq -r .isDraft <<<"$RELEASE_JSON")"
          RELEASE_IS_IMMUTABLE="$(jq -r .isImmutable <<<"$RELEASE_JSON")"
          test "$RELEASE_TAG" = "$TAG"
          test "$RELEASE_TARGET" = "$GITHUB_SHA"
          if [ "$RELEASE_IS_DRAFT" != "true" ] && [ "$RELEASE_IS_IMMUTABLE" != "true" ]; then
            echo "::error::release_not_immutable: published $TAG is not immutable"
            exit 1
          fi

          EXPECTED_ASSETS="$(printf '%s\n' \
            SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
          RELEASE_ASSETS="$(jq -r '.assets[].name' <<<"$RELEASE_JSON" | LC_ALL=C sort)"
          UNEXPECTED_ASSETS="$(printf '%s\n' "$RELEASE_ASSETS" | \
            awk 'NF && $0 != "SHA256SUMS" && $0 != "evo-guard.pyz" && $0 != "evo-guard.spdx.json"')"
          if [ -n "$UNEXPECTED_ASSETS" ]; then
            echo "::error::release_asset_set_mismatch: unexpected existing assets"
            printf '%s\n' "$UNEXPECTED_ASSETS"
            exit 1
          fi

          mkdir -p existing-release-assets
          for asset in evo-guard.pyz evo-guard.spdx.json SHA256SUMS; do
            if printf '%s\n' "$RELEASE_ASSETS" | grep -Fxq "$asset"; then
              gh release download "$TAG" --pattern "$asset" \
                --dir existing-release-assets
              if ! cmp -s "dist/$asset" "existing-release-assets/$asset"; then
                echo "::error::release_asset_immutable: existing $asset differs"
                exit 1
              fi
              echo "$asset already exists with identical bytes"
            else
              if [ "$RELEASE_IS_DRAFT" != "true" ]; then
                echo "::error::release_asset_immutable: published release is missing $asset"
                exit 1
              fi
              gh release upload "$TAG" "dist/$asset"
            fi
          done

          FINAL_ASSETS="$(gh release view "$TAG" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort)"
          if [ "$FINAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "::error::release_asset_set_mismatch: final release asset set is not exact"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ASSETS" "$FINAL_ASSETS"
            exit 1
          fi

          # Re-read every mutable authority input and every asset after all
          # uploads. This closes the draft job's mutation window; publication
          # remains behind the distinct protected Environment and final job.
          verify_mutable_authority
          rm -rf final-release-assets
          mkdir final-release-assets
          gh release download "$TAG" --dir final-release-assets
          for asset in evo-guard.pyz evo-guard.spdx.json SHA256SUMS; do
            if ! cmp -s "dist/$asset" "final-release-assets/$asset"; then
              echo "::error::release_asset_readback_mismatch: $asset"
              exit 1
            fi
          done

          RELEASE_RECORD="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          if ! jq -e --arg tag "$TAG" --arg sha "$GITHUB_SHA" '
            (.id | type == "number" and . >= 1 and floor == .) and
            .tag_name == $tag and
            .name == $tag and
            .target_commitish == $sha and
            .prerelease == false and
            .author.login == "github-actions[bot]" and
            .author.id == 41898282 and
            (
              (.draft == true and .immutable == false) or
              (.draft == false and .immutable == true)
            )
          ' <<<"$RELEASE_RECORD" >/dev/null; then
            echo "::error::prepared_release_identity_invalid"
            exit 1
          fi
          RELEASE_ID="$(jq -r .id <<<"$RELEASE_RECORD")"
          {
            printf 'release-id=%s\n' "$RELEASE_ID"
            printf 'pyz-sha256=%s\n' "$(sha256sum dist/evo-guard.pyz | awk '{print $1}')"
            printf 'pyz-size=%s\n' "$(stat -c '%s' dist/evo-guard.pyz)"
            printf 'sbom-sha256=%s\n' "$(sha256sum dist/evo-guard.spdx.json | awk '{print $1}')"
            printf 'sbom-size=%s\n' "$(stat -c '%s' dist/evo-guard.spdx.json)"
            printf 'sums-sha256=%s\n' "$(sha256sum dist/SHA256SUMS | awk '{print $1}')"
            printf 'sums-size=%s\n' "$(stat -c '%s' dist/SHA256SUMS)"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$RELEASE_RECORD" \
            > "$RUNNER_TEMP/prepared-release-record.json"
          python3 -I - "$RUNNER_TEMP/prepared-release-record.json" \
            >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          release = json.loads(
              pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"),
              object_pairs_hook=unique_object,
              parse_constant=lambda value: (_ for _ in ()).throw(
                  ValueError(f"non-finite JSON constant: {value}")
              ),
          )
          if "body" not in release:
              raise SystemExit("prepared release body is absent")
          body = release.get("body")
          if body is not None and not isinstance(body, str):
              raise SystemExit("prepared release body is neither null nor a string")
          canonical = (
              json.dumps(
                  body,
                  ensure_ascii=False,
                  allow_nan=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              + b"\n"
          )
          print(f"release-body-sha256={hashlib.sha256(canonical).hexdigest()}")
          PY

          if [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "Draft $TAG is byte-verified and awaits the protected publish Environment approval."
          else
            echo "Published immutable $TAG and its exact assets match this commit; the final job will re-prove them."
          fi

  publish-release:
    needs: [validate-test, prepare-draft]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: evoguard-release-publication
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate-test.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare-draft.outputs.release-id }}
      EXPECTED_RELEASE_BODY_SHA256: ${{ needs.prepare-draft.outputs.release-body-sha256 }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.prepare-draft.outputs.tag-object-sha }}
      EXPECTED_PYZ_SHA256: ${{ needs.prepare-draft.outputs.pyz-sha256 }}
      EXPECTED_PYZ_SIZE: ${{ needs.prepare-draft.outputs.pyz-size }}
      EXPECTED_SBOM_SHA256: ${{ needs.prepare-draft.outputs.sbom-sha256 }}
      EXPECTED_SBOM_SIZE: ${{ needs.prepare-draft.outputs.sbom-size }}
      EXPECTED_SUMS_SHA256: ${{ needs.prepare-draft.outputs.sums-sha256 }}
      EXPECTED_SUMS_SIZE: ${{ needs.prepare-draft.outputs.sums-size }}
      EXPECTED_MAIN_RULESET_ID: ${{ vars.EVOGUARD_RELEASE_MAIN_RULESET_ID }}
      EXPECTED_TAG_RULESET_ID: ${{ vars.EVOGUARD_RELEASE_TAG_RULESET_ID }}
    steps:
      - name: Validate the approved publication identity
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RELEASE_BODY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MAIN_RULESET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_TAG_RULESET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PYZ_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SBOM_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PYZ_SIZE" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SBOM_SIZE" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SUMS_SIZE" =~ ^[1-9][0-9]*$ ]]

      # No checkout, artifact download from a short-lived Actions store,
      # project setup, dependency install, or candidate execution is permitted
      # in this write-capable job. It consumes only bounded descriptors and
      # downloads the already-reviewed draft assets from the release itself.

      - name: Publish only the exact live draft and prove immutable readback
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_TOKEN: ${{ secrets.EVOGUARD_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_TOKEN:-}" ]; then
            echo "::error::immutable_release_control_token_missing"
            exit 1
          fi

          control_api() {
            GH_TOKEN="$CONTROL_PLANE_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$@"
          }
          release_api() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$@"
          }

          ALLOWED_SIGNERS="$RUNNER_TEMP/evoguard-publish-allowed-signers"
          printf '%s\n' \
            'EvoRiseKsa namespaces="git" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDZCepQbTxouwR5UwSKMF+4RvlK/MRQ+D9HE+fxJOKdi' \
            > "$ALLOWED_SIGNERS"

          EXPECTED_ASSETS="$RUNNER_TEMP/expected-release-assets.json"
          jq -n \
            --arg pyz_digest "sha256:$EXPECTED_PYZ_SHA256" --argjson pyz_size "$EXPECTED_PYZ_SIZE" \
            --arg sbom_digest "sha256:$EXPECTED_SBOM_SHA256" --argjson sbom_size "$EXPECTED_SBOM_SIZE" \
            --arg sums_digest "sha256:$EXPECTED_SUMS_SHA256" --argjson sums_size "$EXPECTED_SUMS_SIZE" '
              {
                "evo-guard.pyz": {digest: $pyz_digest, size: $pyz_size},
                "evo-guard.spdx.json": {digest: $sbom_digest, size: $sbom_size},
                "SHA256SUMS": {digest: $sums_digest, size: $sums_size}
              }
            ' > "$EXPECTED_ASSETS"

          verify_live_authority() {
            local environment_json immutability_json main_ref_json
            local main_branch_json main_compare_json main_head_sha
            local source_commit_json checks_json
            local tag_ref_json tag_object_json tag_payload tag_signature
            local main_rulesets_json main_ruleset_json
            local tag_rulesets_json tag_ruleset_json deploy_keys_json
            local deployment_policies_json

            environment_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/environments/evoguard-release-publication")"
            jq -e '
              .name == "evoguard-release-publication" and
              .can_admins_bypass == false and
              .deployment_branch_policy.protected_branches == false and
              .deployment_branch_policy.custom_branch_policies == true and
              (.protection_rules | length) == 2 and
              ([.protection_rules[] | select(.type == "branch_policy")] | length) == 1 and
              ([.protection_rules[] | select(.type == "required_reviewers")] as $review_rules |
                ($review_rules | length) == 1 and
                $review_rules[0].prevent_self_review == true and
                ($review_rules[0].reviewers | length) == 1 and
                $review_rules[0].reviewers[0].type == "User" and
                $review_rules[0].reviewers[0].reviewer.id == 304223352 and
                $review_rules[0].reviewers[0].reviewer.login == "MANA-awam" and
                $review_rules[0].reviewers[0].reviewer.type == "User")
            ' <<<"$environment_json" >/dev/null || {
              echo "::error::release_publish_environment_not_exact"
              return 1
            }
            deployment_policies_json="$(control_api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/environments/evoguard-release-publication/deployment-branch-policies?per_page=100")"
            jq -e '
              length == 1 and
              .[0].total_count == 1 and
              (.[0].branch_policies | type == "array" and length == 1) and
              (.[0].branch_policies[0].id | type == "number" and . >= 1 and floor == .) and
              .[0].branch_policies[0].name == "main" and
              .[0].branch_policies[0].type == "branch"
            ' <<<"$deployment_policies_json" >/dev/null || {
              echo "::error::release_publish_branch_policy_not_exact_main"
              return 1
            }

            immutability_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/immutable-releases")"
            jq -e \
              '.enabled == true and (.enforced_by_owner | type == "boolean")' \
              <<<"$immutability_json" >/dev/null || {
              echo "::error::immutable_releases_required"
              return 1
            }

            main_ref_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            jq -e \
              '.object.type == "commit" and (.object.sha | test("^[0-9a-f]{40}$"))' \
              <<<"$main_ref_json" >/dev/null || {
              echo "::error::release_main_ref_invalid"
              return 1
            }
            main_branch_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/branches/main")"
            main_head_sha="$(jq -r '.object.sha' <<<"$main_ref_json")"
            jq -e --arg head "$main_head_sha" '
              .name == "main" and
              .protected == true and
              .commit.sha == $head
            ' <<<"$main_branch_json" >/dev/null || {
              echo "::error::release_source_not_protected_main"
              return 1
            }
            main_compare_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main_head_sha")"
            jq -e --arg source "$GITHUB_SHA" '
              .base_commit.sha == $source and
              .merge_base_commit.sha == $source and
              (.status == "ahead" or .status == "identical") and
              .behind_by == 0 and
              ((.status == "identical" and .ahead_by == 0) or
               (.status == "ahead" and .ahead_by > 0))
            ' <<<"$main_compare_json" >/dev/null || {
              echo "::error::release_source_not_in_protected_main_history"
              return 1
            }
            source_commit_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")"
            jq -e --arg sha "$GITHUB_SHA" '
              .sha == $sha and
              .commit.verification.verified == true and
              .commit.verification.reason == "valid" and
              (.commit.verification.signature | type == "string") and
              (.commit.verification.payload | type == "string")
            ' <<<"$source_commit_json" >/dev/null || {
              echo "::error::release_source_signature_invalid"
              return 1
            }

            checks_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100")"
            jq -e '
              .total_count <= 100 and
              .total_count == (.check_runs | length)
            ' <<<"$checks_json" >/dev/null || {
              echo "::error::release_check_run_pagination_incomplete"
              return 1
            }
            jq -e --argjson expected '{
                "CodeQL": 57789,
                "analyze": 15368,
                "blackbox-docker-e2e": 15368,
                "e2e-runners": 15368,
                "fuzz (address)": 15368,
                "fuzz (undefined)": 15368,
                "project-status": 15368,
                "smoke": 15368,
                "test (3.10)": 15368,
                "test (3.11)": 15368,
                "test (3.12)": 15368
              }' '
                . as $document |
                all($expected | to_entries[]; . as $required |
                  ([
                    $document.check_runs[] |
                    select(
                      .name == $required.key and
                      .app.id == $required.value
                    )
                  ] | max_by(.id)) as $latest |
                  $latest != null and $latest.conclusion == "success"
                )
              ' <<<"$checks_json" >/dev/null || {
              echo "::error::release_required_checks_drift"
              return 1
            }

            tag_ref_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            jq -e --arg ref "refs/tags/$TAG" \
              --arg object "$EXPECTED_TAG_OBJECT_SHA" '
              .ref == $ref and
              .object.type == "tag" and
              .object.sha == $object
            ' <<<"$tag_ref_json" >/dev/null || {
              echo "::error::release_tag_drift"
              return 1
            }
            tag_object_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_OBJECT_SHA")"
            jq -e --arg object "$EXPECTED_TAG_OBJECT_SHA" \
              --arg tag "$TAG" --arg sha "$GITHUB_SHA" '
              .sha == $object and
              .tag == $tag and
              .object.type == "commit" and
              .object.sha == $sha and
              .verification.verified == true and
              .verification.reason == "valid" and
              (.verification.signature | type == "string") and
              (.verification.payload | type == "string")
            ' <<<"$tag_object_json" >/dev/null || {
              echo "::error::release_tag_signature_or_target_invalid"
              return 1
            }
            tag_payload="$RUNNER_TEMP/evoguard-publish-tag.payload"
            tag_signature="$RUNNER_TEMP/evoguard-publish-tag.signature"
            jq -j '.verification.payload' <<<"$tag_object_json" > "$tag_payload"
            jq -j '.verification.signature' <<<"$tag_object_json" > "$tag_signature"
            ssh-keygen -Y verify -q \
              -f "$ALLOWED_SIGNERS" -I EvoRiseKsa -n git \
              -s "$tag_signature" < "$tag_payload" || {
              echo "::error::release_tag_not_signed_by_maintainer_root"
              return 1
            }

            # Main must have no bypass actor. In particular, a generic
            # DeployKey bypass here would let the temporary tag transport write
            # to main as well as tags.
            main_rulesets_json="$(control_api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=branch&per_page=100")"
            jq -e --argjson id "$EXPECTED_MAIN_RULESET_ID" '
              (all(.[]; type == "array")) and
              ([.[][] | select(.target == "branch")] as $branch_rulesets |
                ($branch_rulesets | length) == 1 and
                $branch_rulesets[0].id == $id and
                $branch_rulesets[0].enforcement == "active")
            ' <<<"$main_rulesets_json" >/dev/null || {
              echo "::error::release_main_ruleset_inventory_not_exact"
              return 1
            }
            main_ruleset_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/rulesets/$EXPECTED_MAIN_RULESET_ID?includes_parents=true")"
            jq -e --argjson id "$EXPECTED_MAIN_RULESET_ID" \
              --arg repository "$GITHUB_REPOSITORY" '
              .id == $id and
              .name == "EvoOM Guard main signed-source authority" and
              .target == "branch" and
              .source_type == "Repository" and
              .source == $repository and
              .enforcement == "active" and
              .current_user_can_bypass == "never" and
              has("bypass_actors") and
              (.bypass_actors == null or
                ((.bypass_actors | type) == "array" and
                 (.bypass_actors | length) == 0)) and
              .conditions.ref_name.include == ["refs/heads/main"] and
              .conditions.ref_name.exclude == [] and
              ([.rules[].type] | sort) == [
                "creation", "deletion", "non_fast_forward", "pull_request",
                "required_linear_history", "required_status_checks"
              ] and
              ([.rules[] | select(.type == "pull_request")] as $pr |
                ($pr | length) == 1 and
                ($pr[0].parameters.allowed_merge_methods | sort) == [
                  "merge", "rebase", "squash"
                ] and
                $pr[0].parameters.dismiss_stale_reviews_on_push == true and
                $pr[0].parameters.require_code_owner_review == true and
                $pr[0].parameters.require_extra_approval_for_unattributed_changes == true and
                $pr[0].parameters.require_last_push_approval == true and
                $pr[0].parameters.required_approving_review_count == 1 and
                $pr[0].parameters.required_review_thread_resolution == false and
                $pr[0].parameters.required_reviewers == []) and
              ([.rules[] | select(.type == "required_status_checks")] as $checks |
                ($checks | length) == 1 and
                $checks[0].parameters.do_not_enforce_on_create == false and
                $checks[0].parameters.strict_required_status_checks_policy == true and
                ($checks[0].parameters.required_status_checks |
                  sort_by(.context, .integration_id)) == ([
                    {"context":"CodeQL","integration_id":57789},
                    {"context":"analyze","integration_id":15368},
                    {"context":"blackbox-docker-e2e","integration_id":15368},
                    {"context":"e2e-runners","integration_id":15368},
                    {"context":"fuzz (address)","integration_id":15368},
                    {"context":"fuzz (undefined)","integration_id":15368},
                    {"context":"project-status","integration_id":15368},
                    {"context":"smoke","integration_id":15368},
                    {"context":"test (3.10)","integration_id":15368},
                    {"context":"test (3.11)","integration_id":15368},
                    {"context":"test (3.12)","integration_id":15368}
                  ] | sort_by(.context, .integration_id)))
            ' <<<"$main_ruleset_json" >/dev/null || {
              echo "::error::release_main_ruleset_bypass_or_scope_drift"
              return 1
            }

            # The annotated tag is pre-created by one temporary DeployKey
            # authority. The key must be retired before this workflow starts;
            # no repository deploy key remains able to exercise the bypass.
            tag_rulesets_json="$(control_api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100")"
            jq -e --argjson id "$EXPECTED_TAG_RULESET_ID" '
              (all(.[]; type == "array")) and
              ([.[][] | select(.target == "tag")] as $tag_rulesets |
                ($tag_rulesets | length) == 1 and
                $tag_rulesets[0].id == $id and
                $tag_rulesets[0].enforcement == "active")
            ' <<<"$tag_rulesets_json" >/dev/null || {
              echo "::error::release_tag_ruleset_inventory_not_exact"
              return 1
            }
            tag_ruleset_json="$(control_api \
              "repos/$GITHUB_REPOSITORY/rulesets/$EXPECTED_TAG_RULESET_ID?includes_parents=true")"
            jq -e --argjson id "$EXPECTED_TAG_RULESET_ID" \
              --arg repository "$GITHUB_REPOSITORY" '
              .id == $id and
              .name == "EvoOM Guard release tag authority" and
              .target == "tag" and
              .source_type == "Repository" and
              .source == $repository and
              .enforcement == "active" and
              .current_user_can_bypass == "never" and
              .bypass_actors == [{
                "actor_id": null,
                "actor_type": "DeployKey",
                "bypass_mode": "always"
              }] and
              .conditions.ref_name.include == ["refs/tags/v*"] and
              .conditions.ref_name.exclude == [] and
              ([.rules[].type] | sort) == [
                "creation", "deletion", "non_fast_forward", "update"
              ] and
              all(.rules[]; (keys | sort) == ["type"])
            ' <<<"$tag_ruleset_json" >/dev/null || {
              echo "::error::release_tag_ruleset_contract_not_exact"
              return 1
            }

            deploy_keys_json="$(control_api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/keys?per_page=100")"
            jq -e '
              (all(.[]; type == "array")) and
              ([.[][]] | length) == 0
            ' <<<"$deploy_keys_json" >/dev/null || {
              echo "::error::release_tag_transport_not_retired"
              return 1
            }
          }

          validate_release_snapshot() {
            local snapshot="$1"
            local expected_state="$2"
            EXPECTED_STATE="$expected_state" python3 -I - \
              "$snapshot" "$EXPECTED_ASSETS" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def load(path):
              return json.loads(
                  pathlib.Path(path).read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite JSON constant: {value}")
                  ),
              )

          def reject(message):
              raise SystemExit(message)

          release = load(sys.argv[1])
          expected_assets = load(sys.argv[2])
          if not isinstance(release, dict) or not isinstance(expected_assets, dict):
              reject("release snapshot or expected assets is not an object")
          expected_id = int(os.environ["RELEASE_ID"])
          expected_state = os.environ["EXPECTED_STATE"]
          if expected_state not in {"draft", "published"}:
              reject("unknown expected release state")
          author = release.get("author")
          if (
              release.get("id") != expected_id
              or isinstance(release.get("id"), bool)
              or release.get("tag_name") != os.environ["TAG"]
              or release.get("name") != os.environ["TAG"]
              or release.get("target_commitish") != os.environ["GITHUB_SHA"]
              or release.get("prerelease") is not False
              or not isinstance(author, dict)
              or author.get("login") != "github-actions[bot]"
              or author.get("id") != 41898282
          ):
              reject("release identity or author is not exact")
          if expected_state == "draft":
              if (
                  release.get("draft") is not True
                  or release.get("immutable") is not False
                  or release.get("published_at") is not None
              ):
                  reject("release is not the exact unpublished draft")
          elif (
              release.get("draft") is not False
              or release.get("immutable") is not True
              or not isinstance(release.get("published_at"), str)
              or not release["published_at"]
          ):
              reject("release is not the exact published immutable state")

          if "body" not in release:
              reject("release body is absent")
          body = release["body"]
          if body is not None and not isinstance(body, str):
              reject("release body is neither null nor a string")
          canonical_body = (
              json.dumps(
                  body,
                  ensure_ascii=False,
                  allow_nan=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              + b"\n"
          )
          if hashlib.sha256(canonical_body).hexdigest() != os.environ[
              "EXPECTED_RELEASE_BODY_SHA256"
          ]:
              reject("release body digest changed")

          expected_names = {
              "evo-guard.pyz",
              "evo-guard.spdx.json",
              "SHA256SUMS",
          }
          if set(expected_assets) != expected_names:
              reject("expected asset descriptor set is not exact")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != len(expected_names):
              reject("release asset count is not exact")
          if any(not isinstance(asset, dict) for asset in assets):
              reject("release asset entry is not an object")
          if {asset.get("name") for asset in assets} != expected_names:
              reject("release asset names are not exact")
          for asset in assets:
              descriptor = expected_assets.get(asset["name"])
              uploader = asset.get("uploader")
              if not isinstance(descriptor, dict):
                  reject(f"missing asset descriptor: {asset['name']}")
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("size") != descriptor.get("size")
                  or isinstance(asset.get("size"), bool)
                  or asset.get("digest") != descriptor.get("digest")
                  or "label" not in asset
                  or asset["label"] != ""
                  or not isinstance(uploader, dict)
                  or uploader.get("login") != "github-actions[bot]"
                  or uploader.get("id") != 41898282
                  or uploader.get("type") != "Bot"
              ):
                  reject(f"release asset metadata changed: {asset['name']}")
          PY
          }

          capture_release() {
            local output="$1"
            release_api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$output"
            local by_tag="$RUNNER_TEMP/release-by-tag.json"
            release_api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$by_tag"
            jq -e --argjson id "$RELEASE_ID" '.id == $id' \
              "$by_tag" >/dev/null || {
              echo "::error::release_tag_lookup_identity_drift"
              return 1
            }
          }

          readback_exact_assets() {
            local destination="$1"
            rm -rf -- "$destination"
            mkdir -p -- "$destination"
            gh release download "$TAG" --dir "$destination"
            local expected_entries actual_entries
            expected_entries="$(printf 'f\t%s\n' \
              SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
            actual_entries="$(find "$destination" -mindepth 1 -maxdepth 1 \
              -printf '%y\t%f\n' | LC_ALL=C sort)"
            if [ "$actual_entries" != "$expected_entries" ]; then
              echo "::error::release_asset_set_mismatch: live readback is not exact"
              return 1
            fi
            local asset
            for asset in evo-guard.pyz evo-guard.spdx.json SHA256SUMS; do
              local expected_digest expected_size actual_digest actual_size
              expected_digest="$(jq -r --arg asset "$asset" '.[$asset].digest' \
                "$EXPECTED_ASSETS")"
              expected_size="$(jq -r --arg asset "$asset" '.[$asset].size' \
                "$EXPECTED_ASSETS")"
              actual_digest="sha256:$(sha256sum "$destination/$asset" | awk '{print $1}')"
              actual_size="$(stat -c '%s' "$destination/$asset")"
              if [ "$actual_digest" != "$expected_digest" ] || \
                 [ "$actual_size" != "$expected_size" ]; then
                echo "::error::release_asset_readback_mismatch: $asset"
                return 1
              fi
            done
          }

          BEFORE="$RUNNER_TEMP/release-before-publication.json"
          verify_live_authority
          capture_release "$BEFORE"
          if jq -e '.draft == false and .immutable == true' "$BEFORE" >/dev/null; then
            validate_release_snapshot "$BEFORE" published || {
              echo "::error::existing_published_release_not_exact"
              exit 1
            }
            ALREADY_PUBLISHED=true
          else
            validate_release_snapshot "$BEFORE" draft || {
              echo "::error::approved_draft_not_exact"
              exit 1
            }
            ALREADY_PUBLISHED=false
          fi
          readback_exact_assets "$RUNNER_TEMP/release-before-publication-assets"

          # The protected approval has now been consumed. Recheck all mutable
          # authority and the server-side asset digests immediately before the
          # sole publication mutation. GitHub exposes no conditional/CAS form
          # of this PATCH, so the post-state proof remains mandatory.
          verify_live_authority
          IMMEDIATE="$RUNNER_TEMP/release-immediately-before-publication.json"
          capture_release "$IMMEDIATE"
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            validate_release_snapshot "$IMMEDIATE" published || {
              echo "::error::published_release_drift"
              exit 1
            }
            PATCH_STATUS=0
          else
            validate_release_snapshot "$IMMEDIATE" draft || {
              echo "::error::draft_or_asset_drift_immediately_before_publication"
              exit 1
            }
            printf '%s\n' '{"draft":false}' > "$RUNNER_TEMP/publish-request.json"
            printf 'release_id=%s\n' "$RELEASE_ID" \
              > "$RUNNER_TEMP/publication-patch-started"
            set +e
            release_api --method PATCH \
              --input "$RUNNER_TEMP/publish-request.json" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              > "$RUNNER_TEMP/publication-response.json"
            PATCH_STATUS=$?
            set -e
          fi

          PUBLICATION_PROVED=false
          AFTER="$RUNNER_TEMP/release-after-publication.json"
          for attempt in {1..10}; do
            : "$attempt"
            if capture_release "$AFTER" \
              && validate_release_snapshot "$AFTER" published; then
              PUBLICATION_PROVED=true
              break
            fi
            sleep 2
          done
          if [ "$PUBLICATION_PROVED" != "true" ]; then
            echo "::error::immutable_publication_state_unproven: PATCH exit $PATCH_STATUS; manual recovery required"
            exit 1
          fi

          verify_live_authority
          readback_exact_assets "$RUNNER_TEMP/release-after-publication-assets"
          FINAL="$RUNNER_TEMP/release-final-readback.json"
          capture_release "$FINAL"
          validate_release_snapshot "$FINAL" published || {
            echo "::error::published_immutable_release_readback_invalid"
            exit 1
          }
          echo "Published immutable $TAG from exact protected main SHA $GITHUB_SHA with byte-identical asset readback."

  post-publication-verify:
    needs: [validate-test, prepare-draft, publish-release]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: ./.github/workflows/release-published-verify.yml
    with:
      tag: ${{ needs.validate-test.outputs.tag }}
      target_sha: ${{ github.sha }}
      release_id: ${{ needs.prepare-draft.outputs.release-id }}
      tag_object_sha: ${{ needs.prepare-draft.outputs.tag-object-sha }}
      release_body_sha256: ${{ needs.prepare-draft.outputs.release-body-sha256 }}
      pyz_sha256: ${{ needs.prepare-draft.outputs.pyz-sha256 }}
      pyz_size: ${{ needs.prepare-draft.outputs.pyz-size }}
      sbom_sha256: ${{ needs.prepare-draft.outputs.sbom-sha256 }}
      sbom_size: ${{ needs.prepare-draft.outputs.sbom-size }}
      sums_sha256: ${{ needs.prepare-draft.outputs.sums-sha256 }}
      sums_size: ${{ needs.prepare-draft.outputs.sums-size }}
