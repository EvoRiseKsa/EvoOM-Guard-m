# ─────────────────────────────────────────────────────────────────────────────
# The official release path. A maintainer dispatches this workflow manually
# with the release tag; nothing here is gated on dates, elapsed time, or
# stabilization windows. Policy: time-based release gates are abolished
# (see docs/GOVERNANCE.md).
#
# The pipeline validates the requested tag against `evoom_guard.__version__`,
# runs lint/type/test plus Linux and Windows end-to-end checks, builds the
# reproducible `evo-guard.pyz` and SPDX SBOM with checksums, attests the
# assets, and prepares a DRAFT release. Publication of the draft stays a
# deliberate human action in the GitHub UI.
#
# The workflow is manual-only and its jobs accept the default branch only.
# A push to an unprotected release/* branch must never receive the contents:write
# token used to create a draft release.
#
# These job-level ref guards assume this reviewed workflow definition is
# intact. They are not an external trust root against a maintainer who can
# alter a workflow on the ref selected for workflow_dispatch.
#
# The archived A-H signed lane (evoguard-*-release-*.yml) remains inert with
# all activation flags false; it is a design reference, not a release path.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must equal 'v' + evoom_guard.__version__)"
        required: true

# Every permission is declared at the narrowest possible scope below. This
# prevents a future job from inheriting a repository-wide write token by
# accident; only prepare-draft needs contents:write.
permissions: {}

# Never cancel an earlier release run: cancellation after uploading one asset
# would leave an incomplete draft that a later run must audit before mutation.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-test:
    # workflow_dispatch can be invoked with another ref; that must be a no-op.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the provenance-ancestry and failure-registry tests
          # verify source-to-evidence commit ancestry, which a shallow
          # checkout cannot prove.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the requested tag
        id: resolve-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$DISPATCH_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::invalid_release_tag: expected canonical vMAJOR.MINOR.PATCH, got '$TAG'"
            exit 2
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          echo "releasing $TAG from $GITHUB_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version matches the requested tag
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          V="$(python -c 'import evoom_guard; print(evoom_guard.__version__)')"
          echo "package=$V tag=$TAG"
          test "v$V" = "$TAG"

      - name: Lint (Ruff)
        run: >-
          python -m ruff check
          evoom_guard/ tests/
          ops/build_pyz.py ops/generate_spdx_sbom.py

      - name: Type-check (Mypy)
        run: python -m mypy evoom_guard/

      - name: Type-check release tooling (Mypy strict)
        run: >-
          python -m mypy --strict
          ops/build_pyz.py ops/generate_spdx_sbom.py

      - name: Type-check domain contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/domain/

      - name: Type-check application contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/application/

      - name: Type-check candidate contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/candidate/

      - name: Type-check workspace contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/workspace/

      - name: Type-check policy contracts (Mypy strict)
        run: python -m mypy --strict evoom_guard/policy/

      - name: Tests must be green before a release
        run: python -m pytest tests/ -q

  release-e2e:
    # Re-run the two integration boundaries for the manually selected default
    # branch; the write-capable job cannot run before these complete.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same immutable OCI index as CI's Docker proof.
      EVOGUARD_E2E_IMAGE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install integration-test dependencies
        run: |
          npm ci --ignore-scripts --prefix tools/ci-vitest
          echo "${GITHUB_WORKSPACE}/tools/ci-vitest/node_modules/.bin" >> "$GITHUB_PATH"
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: E2E — vitest and node:test oracles
        run: python -m pytest tests/test_vitest_oracle.py tests/test_node_oracle.py -v
      - name: Sanity — a real Docker daemon is present
        run: docker version
      - name: Prepare pinned runner dependencies
        run: |
          docker pull "$EVOGUARD_E2E_IMAGE"
          docker build --build-arg PYTHON_IMAGE="$EVOGUARD_E2E_IMAGE" \
            --tag evoguard-e2e-pytest:local \
            --file ops/ci/docker/evoguard-e2e-pytest.Dockerfile .
      - name: Docker E2E — the candidate must be confined
        env:
          EVOGUARD_E2E_PYTEST_IMAGE: evoguard-e2e-pytest:local
        run: >-
          python -m pytest tests/test_blackbox_docker_e2e.py
          tests/test_docker_isolation.py::test_docker_setup_suite_and_pack_e2e -v

  release-windows-e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned runner and test dependencies
        run: |
          npm ci --ignore-scripts --prefix tools/ci-vitest
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\tools\ci-vitest\node_modules\.bin"
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Windows E2E — native runner and baseline command resolution
        run: python -m pytest tests/test_vitest_oracle.py tests/test_node_oracle.py -v

  build-artifact:
    needs: [validate-test, release-e2e, release-windows-e2e]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      release-artifact-digest: ${{ steps.upload-release-assets.outputs.artifact-digest }}
      release-artifact-id: ${{ steps.upload-release-assets.outputs.artifact-id }}
    permissions:
      # Candidate code and the built zipapp execute only in this unprivileged
      # job. Provider identity and attestation permissions belong to the
      # separate clean job below.
      contents: read
    env:
      TAG: ${{ needs.validate-test.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build evo-guard.pyz in a clean dependency-free job
        run: python -I ops/build_pyz.py -o dist/evo-guard.pyz

      - name: Smoke-test the artifact
        run: |
          test "$(python -I dist/evo-guard.pyz version)" = "evo-guard ${TAG#v}"
          python -I dist/evo-guard.pyz doctor

      - name: Generate the deterministic external SPDX 2.3 inventory
        run: |
          CREATED="$(git show -s --format=%cI "$GITHUB_SHA")"
          python -I ops/generate_spdx_sbom.py dist/evo-guard.pyz \
            --version "${TAG#v}" \
            --created "$CREATED" \
            --output dist/evo-guard.spdx.json

      - name: Checksums (release integrity)
        run: |
          ( cd dist && \
            sha256sum evo-guard.pyz evo-guard.spdx.json > SHA256SUMS && \
            cat SHA256SUMS )

      - name: Transfer the generated release assets
        id: upload-release-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |
            dist/evo-guard.pyz
            dist/evo-guard.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  attest-release-assets:
    needs: [validate-test, build-artifact]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      approved-artifact-digest: ${{ steps.approve-artifact.outputs.artifact-digest }}
      approved-artifact-id: ${{ steps.approve-artifact.outputs.artifact-id }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.validate-test.outputs.tag }}
    steps:
      - name: Validate the generated artifact identity
        env:
          ARTIFACT_DIGEST: ${{ needs.build-artifact.outputs.release-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-artifact.outputs.release-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      # This job deliberately has no checkout, setup, dependency installation,
      # project-script execution, or zipapp execution. It receives only the
      # immutable artifact created by the unprivileged build job.
      - name: Receive the generated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-artifact.outputs.release-artifact-id }}
          digest-mismatch: error
          path: dist

      - name: Bind the transferred SBOM and checksums to the exact zipapp
        run: |
          set -euo pipefail
          EXPECTED_ENTRIES="$(printf 'f\t%s\n' \
            SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
          ACTUAL_ENTRIES="$(find dist -mindepth 1 -maxdepth 1 \
            -printf '%y\t%f\n' | LC_ALL=C sort)"
          if [ "$ACTUAL_ENTRIES" != "$EXPECTED_ENTRIES" ]; then
            echo "::error::release_asset_set_mismatch: attestation input set is not exact"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ENTRIES" "$ACTUAL_ENTRIES"
            exit 1
          fi
          PYZ_BYTES="$(stat -c '%s' dist/evo-guard.pyz)"
          SBOM_BYTES="$(stat -c '%s' dist/evo-guard.spdx.json)"
          CHECKSUM_BYTES="$(stat -c '%s' dist/SHA256SUMS)"
          if [ "$PYZ_BYTES" -lt 1 ] || [ "$PYZ_BYTES" -gt 67108864 ] || \
             [ "$SBOM_BYTES" -lt 1 ] || [ "$SBOM_BYTES" -gt 16777216 ] || \
             [ "$CHECKSUM_BYTES" -lt 1 ] || [ "$CHECKSUM_BYTES" -gt 512 ]; then
            echo "::error::release_asset_size_invalid: attestation inputs exceed bounded sizes"
            exit 1
          fi
          if [ "$(wc -l < dist/SHA256SUMS)" -ne 2 ] || \
             ! sed -n '1p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.pyz$' || \
             ! sed -n '2p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.spdx\.json$'; then
            echo "::error::release_checksum_format_invalid: SHA256SUMS must contain exactly two filename-ordered digests"
            exit 1
          fi
          ( cd dist && sha256sum -c SHA256SUMS )

          EXPECTED_VERSION="${TAG#v}" python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite JSON constant: {value}")

          sbom_path = Path("dist/evo-guard.spdx.json")
          with sbom_path.open("r", encoding="utf-8") as stream:
              document = json.load(
                  stream,
                  object_pairs_hook=unique_object,
                  parse_constant=reject_constant,
              )
          packages = document.get("packages")
          if not isinstance(packages, list) or len(packages) != 1:
              raise SystemExit("expected exactly one SPDX package")
          package = packages[0]
          expected_fields = {
              "SPDXID": "SPDXRef-Package-evoom-guard",
              "name": "evo-guard",
              "packageFileName": "evo-guard.pyz",
              "versionInfo": os.environ["EXPECTED_VERSION"],
          }
          for field, expected in expected_fields.items():
              if package.get(field) != expected:
                  raise SystemExit(f"unexpected SPDX package {field}")
          checksums = package.get("checksums")
          if not isinstance(checksums, list):
              raise SystemExit("missing SPDX package checksums")
          sha256_values = [
              entry.get("checksumValue")
              for entry in checksums
              if isinstance(entry, dict) and entry.get("algorithm") == "SHA256"
          ]
          if len(sha256_values) != 1:
              raise SystemExit("expected exactly one SPDX package SHA256")
          digest = hashlib.sha256()
          with Path("dist/evo-guard.pyz").open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          if sha256_values[0] != digest.hexdigest():
              raise SystemExit(
                  "sbom_subject_digest_mismatch: SPDX package SHA256 "
                  "does not bind the transferred zipapp"
              )
          PY

      # These are provider attestations for the exact transferred files, not
      # release admission, a vulnerability result, or an EvoGuard verdict.
      - name: Generate GitHub build provenance for the exact artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/evo-guard.pyz

      - name: Generate GitHub SBOM attestation for the exact artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/evo-guard.pyz
          sbom-path: dist/evo-guard.spdx.json

      - name: Approve the exact artifact identity for publication
        id: approve-artifact
        env:
          ARTIFACT_DIGEST: ${{ needs.build-artifact.outputs.release-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-artifact.outputs.release-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact-id=%s\n' "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          printf 'artifact-digest=%s\n' "$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  prepare-draft:
    needs: [validate-test, attest-release-assets]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate-test.outputs.tag }}
    steps:
      - name: Validate the approved artifact identity
        env:
          ARTIFACT_DIGEST: ${{ needs.attest-release-assets.outputs.approved-artifact-digest }}
          ARTIFACT_ID: ${{ needs.attest-release-assets.outputs.approved-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Receive the verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.attest-release-assets.outputs.approved-artifact-id }}
          digest-mismatch: error
          path: dist

      - name: Verify the transferred asset set and checksum
        run: |
          set -euo pipefail
          EXPECTED_ENTRIES="$(printf 'f\t%s\n' \
            SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
          ACTUAL_ENTRIES="$(find dist -mindepth 1 -maxdepth 1 \
            -printf '%y\t%f\n' | LC_ALL=C sort)"
          if [ "$ACTUAL_ENTRIES" != "$EXPECTED_ENTRIES" ]; then
            echo "::error::release_asset_set_mismatch: transferred top-level name/type set is not exact"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ENTRIES" "$ACTUAL_ENTRIES"
            exit 1
          fi
          if [ "$(wc -l < dist/SHA256SUMS)" -ne 2 ] || \
             ! sed -n '1p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.pyz$' || \
             ! sed -n '2p' dist/SHA256SUMS | \
               grep -Eq '^[0-9a-f]{64}  evo-guard\.spdx\.json$'; then
            echo "::error::release_checksum_format_invalid: SHA256SUMS must contain exactly two filename-ordered digests"
            exit 1
          fi
          ( cd dist && sha256sum -c SHA256SUMS )

      - name: Prepare the draft release and immutable asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A rerun must never retarget an existing tag/release or replace an
          # existing asset with bytes built from another commit.
          TAG_SHA=""
          set +e
          TAG_REF_RESPONSE="$(gh api --include \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1)"
          TAG_REF_STATUS=$?
          set -e
          if [ "$TAG_REF_STATUS" -eq 0 ]; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          elif ! grep -Eq '^HTTP/[^ ]+ 404 ' <<<"$TAG_REF_RESPONSE"; then
            echo "::error::release_tag_lookup_failed: could not determine whether $TAG already exists"
            printf '%s\n' "$TAG_REF_RESPONSE" >&2
            exit "$TAG_REF_STATUS"
          fi
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::release_tag_target_mismatch: $TAG points to $TAG_SHA, expected $GITHUB_SHA"
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

          RELEASE_JSON="$(gh release view "$TAG" \
            --json assets,isDraft,isImmutable,tagName,targetCommitish)"
          RELEASE_TAG="$(jq -r .tagName <<<"$RELEASE_JSON")"
          RELEASE_TARGET="$(jq -r .targetCommitish <<<"$RELEASE_JSON")"
          RELEASE_IS_DRAFT="$(jq -r .isDraft <<<"$RELEASE_JSON")"
          RELEASE_IS_IMMUTABLE="$(jq -r .isImmutable <<<"$RELEASE_JSON")"
          test "$RELEASE_TAG" = "$TAG"
          if [ "$RELEASE_TARGET" != "$GITHUB_SHA" ]; then
            echo "::error::release_target_commit_mismatch: $TAG targets $RELEASE_TARGET, expected $GITHUB_SHA"
            exit 1
          fi
          if [ "$RELEASE_IS_DRAFT" != "true" ] && [ "$RELEASE_IS_IMMUTABLE" != "true" ]; then
            echo "::error::release_not_immutable: published $TAG is not immutable"
            exit 1
          fi

          EXPECTED_ASSETS="$(printf '%s\n' \
            SHA256SUMS evo-guard.pyz evo-guard.spdx.json | LC_ALL=C sort)"
          RELEASE_ASSETS="$(jq -r '.assets[].name' <<<"$RELEASE_JSON" | LC_ALL=C sort)"
          UNEXPECTED_ASSETS="$(printf '%s\n' "$RELEASE_ASSETS" | \
            awk 'NF && $0 != "SHA256SUMS" && $0 != "evo-guard.pyz" && $0 != "evo-guard.spdx.json"')"
          if [ -n "$UNEXPECTED_ASSETS" ]; then
            echo "::error::release_asset_set_mismatch: unexpected existing assets"
            printf '%s\n' "$UNEXPECTED_ASSETS"
            exit 1
          fi

          mkdir -p existing-release-assets
          for asset in evo-guard.pyz evo-guard.spdx.json SHA256SUMS; do
            if printf '%s\n' "$RELEASE_ASSETS" | grep -Fxq "$asset"; then
              gh release download "$TAG" --pattern "$asset" \
                --dir existing-release-assets
              if ! cmp -s "dist/$asset" "existing-release-assets/$asset"; then
                echo "::error::release_asset_immutable: existing $asset differs"
                exit 1
              fi
              echo "$asset already exists with identical bytes"
            else
              if [ "$RELEASE_IS_DRAFT" != "true" ]; then
                echo "::error::release_asset_immutable: published release is missing $asset"
                exit 1
              fi
              gh release upload "$TAG" "dist/$asset"
            fi
          done

          FINAL_ASSETS="$(gh release view "$TAG" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort)"
          if [ "$FINAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "::error::release_asset_set_mismatch: final release asset set is not exact"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ASSETS" "$FINAL_ASSETS"
            exit 1
          fi

          if [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "Draft $TAG is ready with the exact verified asset set. Select the Marketplace checkbox and publish it in GitHub's web UI."
          else
            echo "Published immutable $TAG and its exact assets match this commit; no mutation attempted."
          fi
