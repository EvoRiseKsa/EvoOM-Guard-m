name: "EvoOM Guard"
# Marketplace requires < 125 characters; the full story lives in the README.
description: >-
  Evidence-bound agent gate: rejects test-harness edits;
  emits bounded verdicts and optional black-box evidence.
branding:
  icon: "shield"
  color: "red"

inputs:
  base-ref:
    description: "Git ref to diff against (default: the PR base SHA, else HEAD^)."
    required: false
    default: ""
  test-command:
    description: "Test command run inside the repo copy (default: pytest -q)."
    required: false
    default: ""
  protected:
    description: "Extra space-separated globs the patch may not modify."
    required: false
    default: ""
  comment:
    description: "Deprecated security guard. In-job PR commenting is refused because candidate code must not share a pull-requests:write token. Leave false; if a comment is required, upload report-path as a bounded artifact for a separate metadata-only job."
    required: false
    default: "false"
  # PR runs enforce any-non-pass at runtime; rejected-only is only for trusted non-PR use.
  fail-on:
    description: "Verdicts that fail the step: 'any-non-pass' (default) or 'rejected-only'. PR runs require any-non-pass; rejected-only is accepted only for trusted non-PR invocations."
    required: false
    default: "any-non-pass"
  agent-origin:
    description: "Optional display-only origin label (for example, 'codex'). It never shapes the verdict and is always reported as DECLARED_UNVERIFIED; authenticate agent provenance in a separate trusted attestation/finalization lane."
    required: false
    default: ""
  isolation:
    description: "Isolation: 'subprocess' (default), 'docker', or 'gvisor' (the latter two need docker-image + a docker daemon; 'gvisor' also needs the runsc runtime)."
    required: false
    default: ""
  docker-image:
    description: "Container image for isolation 'docker'/'gvisor' (must carry the test runner, e.g. node:22-slim)."
    required: false
    default: ""
  docker-network:
    description: "Container network for isolation 'docker'/'gvisor' (default: 'none' — no network, the safe choice; pass a docker network name only if the suite genuinely needs it)."
    required: false
    default: ""
  operating-profile:
    description: "Optional trust/runtime contract: 'local', 'protected', or 'hostile'. On pull_request this setting must come from the verified base .evoguard.json policy; candidate-controlled workflow input is ignored."
    required: false
    default: ""
  strict-harness:
    description: "Opt-in harness profile: make dependency/compiler manifests immutable and require a non-empty structured JUnit verdict. On pull_request this setting must come from the verified base .evoguard.json policy, not this workflow input."
    required: false
    default: ""
  sarif:
    description: "If set, write a SARIF 2.1.0 report to this workspace path (upload it with github/codeql-action/upload-sarif)."
    required: false
    default: ""
  # Built-in judge-owned tests/config/CI/auto-exec remain non-exemptible.
  allow:
    description: "Baseline allowlist for adopter-defined extra protected globs only; built-in tests, config, CI, and auto-exec paths are never exemptible."
    required: false
    default: ""
  allow-new-tests:
    description: "Feature mode: 'true' allows brand-new test files (edits to existing tests/config/auto-exec stay rejected)."
    required: false
    default: "false"
  timeout:
    description: "Per-run suite timeout in seconds."
    required: false
    default: ""
  mem-limit:
    description: "Address-space cap (MB) for the test subprocess; 0 disables it (needed for Node/V8 suites)."
    required: false
    default: ""
  verifier-pack:
    description: "Repository-relative path to judge-owned pytest invariants. On a PR the Action materializes this directory from the verified base commit, never from the candidate checkout. Pair it with an EVOGUARD_PACK_V2 identity pin (input or trusted base policy)."
    required: false
    default: ""
  expect-verifier-pack-sha256:
    description: "Fail-closed EVOGUARD_PACK_V2 identity pin for verifier-pack (64 hex characters from pack-doctor). The accepted snapshot must match before candidate code runs."
    required: false
    default: ""
  blackbox:
    description: "'true' runs the external black-box judge (needs verifier-pack). The pack must reach the candidate through $EVOGUARD_EXEC; candidate isolation is claimed only after an observed launcher invocation (and container CID). By default the repo's own suite is also required, so overall report integrity is the weaker repo-native channel. See docs/BLACKBOX.md."
    required: false
    default: "false"
  blackbox-only:
    description: "With blackbox, judge ONLY the external pack and skip the repo's own suite (for pure-CLI/service targets with no in-repo tests). Otherwise a failing repo suite blocks the merge even if the pack passes."
    required: false
    default: "false"
  require-report-integrity:
    description: "For completed PASS verdicts, fail closed unless this end-to-end report_integrity level is delivered ('same_process_candidate_writable' or 'external_process_isolated'). Static/preflight/incomplete causes remain unchanged. 'external_process_isolated' requires blackbox-only; default blackbox is composite with the weaker repo-native channel."
    required: false
    default: ""
  require-candidate-isolation:
    description: "For completed PASS verdicts, fail closed unless this candidate isolation is observed ('subprocess'|'docker'|'gvisor'). Preparing a runner is insufficient: blackbox requires an EVOGUARD_EXEC receipt, plus a runtime CID for docker/gvisor. Static/preflight/incomplete causes remain unchanged."
    required: false
    default: ""
  trust-setup-on-host:
    description: "Optional tri-state override: 'true' runs setup_command on the host (weakens effective isolation to subprocess); 'false' forces container setup; blank respects .evoguard.json."
    required: false
    default: ""
  diff-coverage:
    description: "'true' measures which changed lines the suite actually executed (one extra suite run plus configured setup replay; the selected Python environment must already provide coverage.py). Same-process candidate code can mutate coverage state; use as a non-hostile-code quality signal, not adversarial integrity evidence."
    required: false
    default: "false"
  min-diff-coverage:
    description: "Quality gate for non-hostile code: the exact executed/total ratio below this percentage becomes FAIL; unavailable measurement becomes ERROR. Isolated startup blocks module/config shadowing, but candidate code shares and can mutate the collector process. Implies diff-coverage."
    required: false
    default: ""
  baseline-evidence:
    description: "'true' adds before/after differential evidence: the suite ALSO runs on the pristine base, and the report shows repair_effect ('demonstrated' only when base FAILs and candidate PASSes under the same judge). One extra suite run; evidence only."
    required: false
    default: "false"
  require-demonstrated-fix:
    description: "Gate (implies baseline-evidence): a PASS whose repair effect is not demonstrated (base already green, or no clean baseline) becomes FAIL (fix_not_demonstrated). For agent 'fix' PRs only — ordinary feature PRs start from a green base and would fail this."
    required: false
    default: "false"

outputs:
  verdict:
    description: "PASS | REJECTED | FAIL | TAMPERED | ERROR"
    value: ${{ steps.guard.outputs.verdict }}
  json-path:
    description: "Path (on the runner) of the machine-readable verdict JSON — carries the full attestation (effective_policy, policy_sha256, base/head commit+tree SHAs). Upload or sign it in a follow-up step."
    value: ${{ steps.guard.outputs.json-path }}
  report-path:
    description: "Path (on the runner) of the Markdown report."
    value: ${{ steps.guard.outputs.report-path }}
  head-sha:
    description: "The head commit SHA the verdict was bound to."
    value: ${{ steps.guard.outputs.head-sha }}
  policy-sha:
    description: "sha256 of the COMPLETE effective policy that shaped the judgment (attestation.policy_sha256) — pass to `evo-guard verify-verdict --expect-policy-sha`."
    value: ${{ steps.guard.outputs.policy-sha }}
  receipt-sha256:
    description: "SHA-256 of the exact JSON receipt bytes at json-path when they pass the bounded strict parser; blank otherwise. This detects byte changes but is not a signature or provenance attestation."
    value: ${{ steps.guard.outputs.receipt-sha256 }}

runs:
  using: "composite"
  steps:
    - name: Refuse in-job PR commenting
      if: ${{ inputs.comment == 'true' }}
      shell: bash
      run: |
        echo "::error::EvoGuard refuses comment=true: the candidate-execution job must not hold pull-requests:write. Leave comment=false and post from a separate metadata-only job that never checks out or executes candidate code."
        exit 2

    - name: Refuse persisted checkout credentials
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        reject_credentials() {
          echo "::error::EvoGuard refuses to execute candidate code while checkout credentials are reachable. Set actions/checkout persist-credentials: false and remove repository-scoped credential helpers or authenticated remote URLs."
          exit 2
        }
        inspect_git_config_for_credentials() {
          local pattern="$1"
          local config_status=0
          git config --includes --show-origin --get-regexp "$pattern" \
            >/dev/null 2>&1 || config_status=$?
          case "$config_status" in
            0)
              reject_credentials
              ;;
            1)
              return 0
              ;;
            *)
              echo "::error::EvoGuard could not safely inspect Git config for persisted checkout credentials (git config exited $config_status); refusing candidate execution."
              exit 2
              ;;
          esac
        }
        fail_remote_credential_inspection() {
          local status="$1"
          echo "::error::EvoGuard could not safely enumerate every Git remote fetch/push URL (git exited $status); refusing candidate execution."
          exit 2
        }
        remote_url_has_userinfo() {
          local remote_url="$1"
          # HTTP(S) userinfo is always a credential risk. For other URI schemes,
          # reject an explicit user:password pair while allowing ordinary
          # username-only SSH forms such as ssh://git@host and git@host:path.
          # Never echo remote_url: it may contain the credential.
          [[ "$remote_url" =~ ^https?://[^/@]+@ ]] ||
            [[ "$remote_url" =~ ^[Hh][Tt][Tt][Pp][Ss]?://[^/?#]*@ ]] ||
            [[ "$remote_url" =~ ^[[:alpha:]][[:alnum:].+-]*://[^/?#@]*:[^/?#@]*@ ]] ||
            [[ "$remote_url" =~ ^//[^/?#@]*:[^/?#@]*@ ]]
        }
        inspect_remote_urls_for_credentials() {
          local remote_names=""
          local remote_status=0
          local remote_name=""
          local remote_urls=""
          local url_status=0
          local direction=""

          if remote_names="$(git remote 2>/dev/null)"; then
            remote_status=0
          else
            remote_status=$?
          fi
          if [ "$remote_status" -ne 0 ]; then
            fail_remote_credential_inspection "$remote_status"
          fi
          # `git remote` exits zero and emits nothing when no remotes exist.
          if [ -z "$remote_names" ]; then
            return 0
          fi

          while IFS= read -r remote_name; do
            if [ -z "$remote_name" ] || [[ "$remote_name" == *$'\r'* ]] || \
               [[ "$remote_name" == *$'\t'* ]]; then
              fail_remote_credential_inspection 2
            fi
            for direction in fetch push; do
              remote_urls=""
              url_status=0
              if [ "$direction" = "fetch" ]; then
                if remote_urls="$(git remote get-url --all "$remote_name" 2>/dev/null)"; then
                  url_status=0
                else
                  url_status=$?
                fi
              elif remote_urls="$(
                git remote get-url --push --all "$remote_name" 2>/dev/null
              )"; then
                url_status=0
              else
                url_status=$?
              fi
              if [ "$url_status" -ne 0 ] || [ -z "$remote_urls" ]; then
                unset remote_urls
                fail_remote_credential_inspection "$url_status"
              fi
              while IFS= read -r remote_url; do
                if [ -z "$remote_url" ] || [[ "$remote_url" == *$'\r'* ]] || \
                   [[ "$remote_url" == *$'\t'* ]]; then
                  unset remote_url remote_urls
                  fail_remote_credential_inspection 2
                fi
                if remote_url_has_userinfo "$remote_url"; then
                  unset remote_url remote_urls
                  reject_credentials
                fi
                unset remote_url
              done <<< "$remote_urls"
              unset remote_urls
            done
            unset remote_name
          done <<< "$remote_names"
          unset remote_names
        }
        git rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
          echo "::error::EvoGuard requires a Git worktree checkout."
          exit 2
        }
        # Never print these values: an http.*.extraheader commonly contains the
        # base64-encoded GITHUB_TOKEN. --includes also resolves checkout v6/v7's
        # conditional credential file under RUNNER_TEMP.
        # `git config --get-regexp` returns 1 for a clean "no match". Any
        # higher status means the credential sources could not be inspected and
        # must fail closed rather than being mistaken for an empty result.
        inspect_git_config_for_credentials '^http\..*\.extraheader$'
        inspect_git_config_for_credentials '^credential(\..*)?\.helper$'
        for SECRET_TRANSPORT in GIT_ASKPASS SSH_ASKPASS SSH_AUTH_SOCK GH_TOKEN GITHUB_TOKEN; do
          if [[ -v "$SECRET_TRANSPORT" && -n "${!SECRET_TRANSPORT}" ]]; then
            unset SECRET_TRANSPORT
            reject_credentials
          fi
        done
        unset SECRET_TRANSPORT
        inspect_remote_urls_for_credentials

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Build EvoGuard archive
      shell: bash
      env:
        EVOGUARD_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Build the reviewed stdlib-only source that GitHub materialized for
        # this Action reference. This bootstrap never invokes pip, a package
        # resolver, a build backend, or PyPI.
        python -I "$EVOGUARD_ACTION_PATH/ops/build_pyz.py" \
          -o "$RUNNER_TEMP/evo-guard.pyz"
        python -I "$RUNNER_TEMP/evo-guard.pyz" version

    - name: Run EvoGuard
      id: guard
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_TEST_COMMAND: ${{ inputs.test-command }}
        INPUT_PROTECTED: ${{ inputs.protected }}
        INPUT_ALLOW: ${{ inputs.allow }}
        INPUT_ALLOW_NEW_TESTS: ${{ inputs.allow-new-tests }}
        INPUT_ISOLATION: ${{ inputs.isolation }}
        INPUT_DOCKER_IMAGE: ${{ inputs.docker-image }}
        INPUT_DOCKER_NETWORK: ${{ inputs.docker-network }}
        INPUT_OPERATING_PROFILE: ${{ inputs.operating-profile }}
        INPUT_STRICT_HARNESS: ${{ inputs.strict-harness }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MEM_LIMIT: ${{ inputs.mem-limit }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_VERIFIER_PACK: ${{ inputs.verifier-pack }}
        INPUT_EXPECT_VERIFIER_PACK_SHA256: ${{ inputs.expect-verifier-pack-sha256 }}
        INPUT_BLACKBOX: ${{ inputs.blackbox }}
        INPUT_BLACKBOX_ONLY: ${{ inputs.blackbox-only }}
        INPUT_REQUIRE_REPORT_INTEGRITY: ${{ inputs.require-report-integrity }}
        INPUT_REQUIRE_CANDIDATE_ISOLATION: ${{ inputs.require-candidate-isolation }}
        INPUT_TRUST_SETUP_ON_HOST: ${{ inputs.trust-setup-on-host }}
        INPUT_DIFF_COVERAGE: ${{ inputs.diff-coverage }}
        INPUT_MIN_DIFF_COVERAGE: ${{ inputs.min-diff-coverage }}
        INPUT_BASELINE_EVIDENCE: ${{ inputs.baseline-evidence }}
        INPUT_REQUIRE_DEMONSTRATED_FIX: ${{ inputs.require-demonstrated-fix }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_AGENT_ORIGIN: ${{ inputs.agent-origin }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if ! CANDIDATE_COMMIT="$(git rev-parse HEAD 2>/dev/null)"; then
          CANDIDATE_COMMIT=""
        fi
        write_agent_gate_summary() {
          local fallback_verdict="$1"
          local setup_code="$2"
          local setup_message="$3"
          local require_receipt="$4"
          local guard_code="$5"
          if ! python -I - \
            "$RUNNER_TEMP/guard.json" \
            "$GITHUB_STEP_SUMMARY" \
            "$CANDIDATE_COMMIT" \
            "$INPUT_AGENT_ORIGIN" \
            "$fallback_verdict" \
            "$setup_code" \
            "$setup_message" \
            "$RUNNER_TEMP/guard-receipt.sha256" \
            "$require_receipt" \
            "$guard_code" <<'PY'
        # BEGIN AGENT_GATE_SUMMARY_PY
        import hashlib
        import html
        import json
        import math
        import os
        from pathlib import Path
        import re
        import stat
        import sys
        import unicodedata

        MAX_RECEIPT_BYTES = 8 * 1024 * 1024

        receipt_path = Path(sys.argv[1])
        summary_path = Path(sys.argv[2])
        fallback_commit = sys.argv[3]
        declared_origin_input = sys.argv[4]
        fallback_verdict = sys.argv[5]
        setup_code = sys.argv[6]
        setup_message = sys.argv[7]
        receipt_digest_path = Path(sys.argv[8])
        require_receipt = sys.argv[9] == "true"
        guard_code_text = sys.argv[10]
        summary_verdict_path = receipt_digest_path.with_suffix(".verdict")
        policy_digest_path = receipt_digest_path.with_suffix(".policy")
        receipt_digest_path.unlink(missing_ok=True)
        summary_verdict_path.unlink(missing_ok=True)
        policy_digest_path.unlink(missing_ok=True)

        verdicts = {"PASS", "REJECTED", "FAIL", "TAMPERED", "ERROR"}
        badges = {
            "PASS": "✅",
            "REJECTED": "⛔",
            "FAIL": "❌",
            "TAMPERED": "🚨",
            "ERROR": "⚠️",
        }

        def mapping(value):
            return value if isinstance(value, dict) else {}

        def cell(value):
            if value is None or value == "":
                return "not available"
            rendered = str(value).replace("\r", " ").replace("\n", " ")
            return html.escape(rendered, quote=True).replace("|", "&#124;")

        def code(value):
            return f"<code>{cell(value)}</code>"

        def digest(value, length=64):
            normalized = str(value or "").lower()
            if re.fullmatch(rf"[0-9a-f]{{{length}}}", normalized):
                return normalized
            return None

        def bounded_display(value, *, limit, fallback):
            if not isinstance(value, str) or not value:
                return fallback
            encoded = value.encode("utf-8")
            if len(encoded) <= limit:
                return value
            prefix = encoded[:limit].decode("utf-8", errors="ignore")
            observed = hashlib.sha256(encoded).hexdigest()
            return f"{prefix}… [truncated; sha256={observed}]"

        def unique_object(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    raise ValueError(f"duplicate JSON key: {key!r}")
                result[key] = value
            return result

        def reject_constant(value):
            raise ValueError(f"non-finite JSON constant: {value}")

        def finite_float(value):
            parsed = float(value)
            if not math.isfinite(parsed):
                raise ValueError("non-finite JSON number")
            return parsed

        def bounded_origin(value):
            if not value:
                return "not supplied"
            if (
                value != value.strip()
                or unicodedata.normalize("NFC", value) != value
                or len(value.encode("utf-8")) > 256
                or any(unicodedata.category(character).startswith("C") for character in value)
            ):
                return "invalid declaration rejected"
            return value

        declared_origin = bounded_origin(declared_origin_input)

        record = {}
        receipt_bytes = None
        receipt_present = False
        receipt_valid = False
        receipt_status = "not_emitted"
        if require_receipt:
            try:
                before = receipt_path.lstat()
                receipt_present = True
                reparse_flag = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 1024)

                def is_reparse(value):
                    return bool(getattr(value, "st_file_attributes", 0) & reparse_flag)

                if (
                    stat.S_ISLNK(before.st_mode)
                    or is_reparse(before)
                    or not stat.S_ISREG(before.st_mode)
                ):
                    receipt_status = "receipt_not_regular_file"
                elif before.st_size > MAX_RECEIPT_BYTES:
                    receipt_status = "receipt_size_limit_exceeded"
                else:
                    flags = os.O_RDONLY | getattr(os, "O_BINARY", 0)
                    flags |= getattr(os, "O_NOFOLLOW", 0)
                    flags |= getattr(os, "O_NONBLOCK", 0)
                    descriptor = os.open(receipt_path, flags)
                    try:
                        with os.fdopen(descriptor, "rb", closefd=False) as handle:
                            opened = os.fstat(handle.fileno())
                            identity = [
                                "st_dev",
                                "st_ino",
                                "st_mode",
                                "st_nlink",
                                "st_size",
                                "st_mtime_ns",
                            ]
                            identity.extend(
                                field
                                for field in ("st_file_attributes", "st_reparse_tag")
                                if hasattr(before, field) and hasattr(opened, field)
                            )
                            if (
                                not stat.S_ISREG(opened.st_mode)
                                or is_reparse(opened)
                                or any(getattr(before, key) != getattr(opened, key) for key in identity)
                            ):
                                raise OSError("receipt identity changed before open")
                            candidate_bytes = handle.read(MAX_RECEIPT_BYTES + 1)
                            after_handle = os.fstat(handle.fileno())
                    finally:
                        os.close(descriptor)
                    after_path = receipt_path.lstat()
                    if (
                        is_reparse(after_handle)
                        or is_reparse(after_path)
                        or any(
                            getattr(before, key) != getattr(after_handle, key)
                            or getattr(before, key) != getattr(after_path, key)
                            for key in identity
                        )
                    ):
                        raise OSError("receipt identity changed during read")
                    if len(candidate_bytes) > MAX_RECEIPT_BYTES:
                        receipt_status = "receipt_size_limit_exceeded"
                    else:
                        decoded = json.loads(
                            candidate_bytes.decode("utf-8"),
                            object_pairs_hook=unique_object,
                            parse_constant=reject_constant,
                            parse_float=finite_float,
                        )
                        if not isinstance(decoded, dict):
                            raise ValueError("JSON receipt root must be an object")
                        receipt_bytes = candidate_bytes
                        record = decoded
                        receipt_valid = True
                        receipt_status = "strict_json_accepted"
            except FileNotFoundError:
                pass
            except OSError:
                receipt_present = True
                receipt_status = "receipt_unreadable"
            except (UnicodeDecodeError, ValueError, json.JSONDecodeError):
                receipt_status = "receipt_json_invalid"
        else:
            # Setup failures happen before the current Guard invocation. Ignore
            # every pre-existing path even if a prior composite invocation used
            # the same RUNNER_TEMP; stale PASS bytes must never override ERROR.
            receipt_status = "not_emitted_for_setup_error"

        if receipt_valid:
            try:
                guard_code = int(guard_code_text)
            except ValueError:
                guard_code = -1
            record_verdict = record.get("verdict")
            record_exit = record.get("exit_code")
            record_passed = record.get("passed")
            record_attestation = record.get("attestation")
            envelope_valid = (
                guard_code in {0, 1}
                and record.get("schema_version") in {"1.11", "1.12"}
                and record.get("tool") == "evoguard"
                and isinstance(record.get("tool_version"), str)
                and bool(record["tool_version"])
                and isinstance(record_verdict, str)
                and record_verdict in verdicts
                and type(record_passed) is bool
                and record_passed is (record_verdict == "PASS")
                and type(record_exit) is int
                and record_exit == (0 if record_verdict == "PASS" else 1)
                and guard_code == record_exit
                and isinstance(record.get("reason_code"), str)
                and bool(record["reason_code"])
                and isinstance(record.get("reason"), str)
                and isinstance(record.get("assurance"), dict)
                and (record_attestation is None or isinstance(record_attestation, dict))
            )
            if not envelope_valid:
                record = {}
                receipt_bytes = None
                receipt_valid = False
                receipt_status = "receipt_semantic_envelope_invalid"

        raw_verdict = record.get("verdict") if receipt_valid else None
        if not receipt_present and not require_receipt:
            raw_verdict = fallback_verdict
        verdict = (
            raw_verdict
            if isinstance(raw_verdict, str) and raw_verdict in verdicts
            else "ERROR"
        )
        attestation = mapping(record.get("attestation"))
        assurance = mapping(record.get("assurance"))
        pack_assurance = mapping(assurance.get("verifier_pack"))

        candidate_commit = (
            digest(attestation.get("head_sha"), 40)
            or digest(attestation.get("head_sha"), 64)
            or digest(fallback_commit, 40)
            or digest(fallback_commit, 64)
        )
        candidate_digest = digest(attestation.get("candidate_sha256"))
        policy_digest = digest(attestation.get("policy_sha256"))
        pack_digest = digest(attestation.get("verifier_pack_sha256")) or digest(
            pack_assurance.get("snapshot_sha256")
        )
        receipt_digest = (
            hashlib.sha256(receipt_bytes).hexdigest()
            if receipt_valid and receipt_bytes is not None
            else None
        )
        if receipt_valid:
            reason_code = bounded_display(
                record.get("reason_code"),
                limit=256,
                fallback="not_available",
            )
            reason = bounded_display(
                record.get("reason"),
                limit=4096,
                fallback="No reason was emitted.",
            )
        elif receipt_present:
            reason_code = receipt_status
            reason = "Agent Gate refused an ambiguous, invalid, or oversized receipt."
        elif not require_receipt:
            reason_code = bounded_display(
                setup_code,
                limit=256,
                fallback="receipt_not_emitted",
            )
            reason = bounded_display(
                setup_message,
                limit=4096,
                fallback="No JSON receipt was emitted.",
            )
        else:
            reason_code = "receipt_not_emitted"
            reason = "Agent Gate required a JSON receipt, but none was emitted."
        summary_verdict_path.write_text(verdict + "\n", encoding="ascii")
        if receipt_digest is not None:
            receipt_digest_path.write_text(receipt_digest + "\n", encoding="ascii")
        if policy_digest is not None:
            policy_digest_path.write_text(policy_digest + "\n", encoding="ascii")

        rows = [
            ("Verdict", f"**{cell(verdict)}**"),
            ("Reason code", code(reason_code)),
            ("Candidate commit", code(candidate_commit)),
            ("Candidate change digest", code(candidate_digest)),
            ("Policy SHA-256", code(policy_digest)),
            (
                "Report integrity",
                code(
                    bounded_display(
                        assurance.get("report_integrity"),
                        limit=256,
                        fallback="not available",
                    )
                ),
            ),
            (
                "Candidate isolation",
                code(
                    bounded_display(
                        assurance.get("candidate_isolation"),
                        limit=256,
                        fallback="not available",
                    )
                ),
            ),
            ("Verifier pack SHA-256", code(pack_digest)),
            ("Agent origin status", code("DECLARED_UNVERIFIED")),
            ("Declared agent origin", code(declared_origin or "not supplied")),
            (
                "JSON receipt",
                code(str(receipt_path)) if receipt_present else "not emitted",
            ),
            ("Receipt parser", code(receipt_status)),
            ("Receipt SHA-256", code(receipt_digest)),
            (
                "Receipt authentication",
                "byte digest only; sign/finalize in a separate trusted lane",
            ),
        ]

        lines = [
            f"## EvoOM Agent Gate — {badges[verdict]} {verdict}",
            "",
            f"<strong>{cell(reason)}</strong>",
            "",
            "| Field | Observed value |",
            "|---|---|",
            *[f"| {name} | {value} |" for name, value in rows],
            "",
            "> Agent origin is display-only and unverified in this Action. "
            "The receipt SHA-256 identifies local bytes; neither field is a "
            "signature, agent identity attestation, or proof of independent judgment.",
            "",
        ]
        with summary_path.open("a", encoding="utf-8", newline="\n") as handle:
            handle.write("\n".join(lines))
        # END AGENT_GATE_SUMMARY_PY
        PY
          then
            {
              echo "## EvoOM Agent Gate — ⚠️ ERROR"
              echo
              echo "The bounded Agent Gate summary could not be rendered."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        }
        # A diagnosable, fail-fast exit for setup problems (missing base, shallow
        # history): name the cause, write it to the step summary, and stop BEFORE
        # the guard runs — never let a broken diff surface as a confusing
        # "empty diff" verdict downstream.
        fail_setup() {
          echo "::error::EvoGuard: $1 — $2"
          echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
          echo "head-sha=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          write_agent_gate_summary "ERROR" "$1" "$2" "false" "-1"
          exit 1
        }
        # RUNNER_TEMP is shared by composite invocations in one job. Remove
        # every prior invocation's fixed-name output before setup so a stale
        # receipt/report/sidecar can never be mistaken for this attempt.
        if ! rm -f -- \
          "$RUNNER_TEMP/guard.json" \
          "$RUNNER_TEMP/guard-report.md" \
          "$RUNNER_TEMP/guard-receipt.sha256" \
          "$RUNNER_TEMP/guard-receipt.verdict" \
          "$RUNNER_TEMP/guard-receipt.policy"; then
          fail_setup "stale_output_cleanup_failed" \
            "could not remove a prior Agent Gate output from RUNNER_TEMP"
        fi
        # On a PR, the event payload is the authority for the base and this
        # action must not accept candidate-controlled workflow inputs that weaken
        # the gate. Outside a PR, a maintainer may choose a base/ref and the
        # narrow rejected-only reporting mode deliberately.
        IS_PR=false
        if [ -n "$PR_BASE_SHA" ]; then
          IS_PR=true
          if [ -n "$INPUT_BASE_REF" ] && [ "$INPUT_BASE_REF" != "$PR_BASE_SHA" ]; then
            fail_setup "untrusted_base_ref_override" \
              "pull_request runs must use the event base SHA; a workflow input may not replace it"
          fi
          if [ "$INPUT_FAIL_ON" != "any-non-pass" ]; then
            fail_setup "untrusted_fail_on_override" \
              "pull_request runs require fail-on=any-non-pass so ERROR/FAIL/TAMPERED cannot turn green"
          fi
          BASE="$PR_BASE_SHA"
        else
          BASE="$INPUT_BASE_REF"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"; fi
        fi
        echo "Diffing against base: $BASE"
        # Fetch only when the exact base object is absent. A full-history
        # checkout stays network-silent here; a shallow checkout gets one
        # best-effort recovery attempt. The second rev-parse remains the
        # authoritative fail-closed check.
        if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE" \
            || echo "::warning::EvoGuard: could not fetch base '$BASE' from origin — trying to resolve it locally"
        fi
        git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null \
          || fail_setup "base_ref_unavailable" \
               "cannot resolve the diff base '$BASE' in this checkout. Use actions/checkout with 'fetch-depth: 0', or pass a 'base-ref' that is reachable from this checkout."
        # Policy is judge-owned input. Read it from the verified base commit, not
        # from the candidate workspace. A missing base policy is a deterministic
        # empty object; an unreadable or malformed present policy fails closed in
        # the CLI below.
        BASE_POLICY_CONFIG="$RUNNER_TEMP/evoguard-base-policy.json"
        if git cat-file -e "${BASE}:.evoguard.json" 2>/dev/null; then
          git show "${BASE}:.evoguard.json" > "$BASE_POLICY_CONFIG" \
            || fail_setup "base_policy_config_unavailable" \
                 "could not materialize .evoguard.json from the verified base commit"
        else
          printf '{}\n' > "$BASE_POLICY_CONFIG" \
            || fail_setup "base_policy_config_unavailable" \
                 "could not write the empty trusted base policy"
        fi
        # `with:` values in a pull_request workflow are read from the candidate
        # merge result. They are therefore not judge policy. The only
        # verifier-pack identity accepted in PR mode comes from this already
        # materialized BASE policy, never from INPUT_*.
        read_base_policy_string() {
          python -I - "$BASE_POLICY_CONFIG" "$1" <<'PY'
        import json
        import sys

        config_path, key = sys.argv[1], sys.argv[2]
        try:
            with open(config_path, encoding="utf-8") as handle:
                config = json.load(handle)
            if not isinstance(config, dict):
                raise ValueError("policy root must be a JSON object")
            value = config.get(key, "")
            if not isinstance(value, str):
                raise ValueError(f"{key} must be a string when present")
            if "\x00" in value or "\n" in value or "\r" in value:
                raise ValueError(f"{key} must not contain control characters")
            print(value)
        except (OSError, ValueError, json.JSONDecodeError) as error:
            print(f"invalid trusted base policy {key}: {error}", file=sys.stderr)
            raise SystemExit(2)
        PY
        }
        EFFECTIVE_VERIFIER_PACK="$INPUT_VERIFIER_PACK"
        EFFECTIVE_EXPECT_VERIFIER_PACK_SHA256="$INPUT_EXPECT_VERIFIER_PACK_SHA256"
        if [ "$IS_PR" = "true" ]; then
          TRUSTED_POLICY_VERIFIER_PACK="$(read_base_policy_string verifier_pack)" \
            || fail_setup "base_policy_verifier_settings_invalid" \
                 "could not read verifier_pack from the verified base .evoguard.json"
          TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256="$(read_base_policy_string expect_verifier_pack_sha256)" \
            || fail_setup "base_policy_verifier_settings_invalid" \
                 "could not read expect_verifier_pack_sha256 from the verified base .evoguard.json"
          if [ -n "$TRUSTED_POLICY_VERIFIER_PACK" ] && [ -z "$TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256" ]; then
            fail_setup "base_policy_verifier_identity_missing" \
              "a PR verifier_pack must have expect_verifier_pack_sha256 in the verified base .evoguard.json"
          fi
          if [ -z "$TRUSTED_POLICY_VERIFIER_PACK" ] && [ -n "$TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256" ]; then
            fail_setup "base_policy_verifier_settings_invalid" \
              "expect_verifier_pack_sha256 requires verifier_pack in the verified base .evoguard.json"
          fi
          if [ -n "$TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256" ] && ! [[ "$TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            fail_setup "base_policy_verifier_settings_invalid" \
              "expect_verifier_pack_sha256 in the verified base .evoguard.json must be 64 hexadecimal characters"
          fi
          if [ -n "$INPUT_VERIFIER_PACK" ] && [ "$INPUT_VERIFIER_PACK" != "$TRUSTED_POLICY_VERIFIER_PACK" ]; then
            fail_setup "untrusted_verifier_pack_override" \
              "pull_request verifier-pack input differs from the verified base policy and is not trusted"
          fi
          if [ -n "$INPUT_EXPECT_VERIFIER_PACK_SHA256" ] && [ "$INPUT_EXPECT_VERIFIER_PACK_SHA256" != "$TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256" ]; then
            fail_setup "untrusted_verifier_pack_override" \
              "pull_request verifier-pack identity input differs from the verified base policy and is not trusted"
          fi
          EFFECTIVE_VERIFIER_PACK="$TRUSTED_POLICY_VERIFIER_PACK"
          EFFECTIVE_EXPECT_VERIFIER_PACK_SHA256="$TRUSTED_POLICY_EXPECT_VERIFIER_PACK_SHA256"
          if [ -n "$INPUT_TEST_COMMAND" ] || [ -n "$INPUT_PROTECTED" ] || [ -n "$INPUT_ALLOW" ] || \
             [ "$INPUT_ALLOW_NEW_TESTS" = "true" ] || [ -n "$INPUT_ISOLATION" ] || \
             [ -n "$INPUT_DOCKER_IMAGE" ] || [ -n "$INPUT_DOCKER_NETWORK" ] || \
             [ -n "$INPUT_OPERATING_PROFILE" ] || \
             [ -n "$INPUT_STRICT_HARNESS" ] || \
             [ -n "$INPUT_TIMEOUT" ] || [ -n "$INPUT_MEM_LIMIT" ] || [ -n "$INPUT_SARIF" ] || \
             [ "$INPUT_BLACKBOX" = "true" ] || [ "$INPUT_BLACKBOX_ONLY" = "true" ] || \
             [ -n "$INPUT_REQUIRE_REPORT_INTEGRITY" ] || [ -n "$INPUT_REQUIRE_CANDIDATE_ISOLATION" ] || \
             [ -n "$INPUT_TRUST_SETUP_ON_HOST" ] || [ "$INPUT_DIFF_COVERAGE" = "true" ] || \
             [ -n "$INPUT_MIN_DIFF_COVERAGE" ] || [ "$INPUT_BASELINE_EVIDENCE" = "true" ] || \
             [ "$INPUT_REQUIRE_DEMONSTRATED_FIX" = "true" ]; then
            echo "::warning::EvoGuard: pull_request ignores workflow inputs that shape the judge; use the verified base .evoguard.json policy instead"
            echo "- EvoGuard used only the verified base policy for judge settings; candidate workflow overrides were ignored." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        set +e
        git diff "$BASE...HEAD" > "$RUNNER_TEMP/guard.diff" 2> "$RUNNER_TEMP/guard-diff.err"
        DIFF_CODE=$?
        set -e
        if [ "$DIFF_CODE" -ne 0 ]; then
          fail_setup "base_diff_failed" \
            "'git diff ${BASE}...HEAD' failed ($(head -c 300 "$RUNNER_TEMP/guard-diff.err")). A shallow checkout with no merge base is the usual cause — use actions/checkout with 'fetch-depth: 0'."
        fi
        # A verifier pack is judge-owned input, not part of the candidate. On a
        # PR, materialize a repository-relative pack from the verified BASE
        # commit into RUNNER_TEMP before passing it to the diff judge. This
        # prevents a candidate from changing a helper inside ./pack and having
        # that helper become the supposedly independent snapshot.
        TRUSTED_VERIFIER_PACK=""
        if [ -n "$EFFECTIVE_VERIFIER_PACK" ]; then
          case "$EFFECTIVE_VERIFIER_PACK" in
            /*|*\\*|.|..|../*|*/../*|*/..)
              fail_setup "untrusted_verifier_pack_path" \
                "verifier-pack must be a safe repository-relative directory; the Action materializes it from the verified base commit"
              ;;
          esac
          PACK_ROOT="$RUNNER_TEMP/evoguard-trusted-pack"
          rm -rf "$PACK_ROOT"
          mkdir -p "$PACK_ROOT" || fail_setup "trusted_verifier_pack_unavailable" \
            "could not create the trusted verifier-pack staging directory"
          git archive --format=tar "$BASE" -- "$EFFECTIVE_VERIFIER_PACK" | tar -x -C "$PACK_ROOT" \
            || fail_setup "trusted_verifier_pack_unavailable" \
              "could not materialize verifier-pack '$EFFECTIVE_VERIFIER_PACK' from the verified base commit"
          TRUSTED_VERIFIER_PACK="$PACK_ROOT/$EFFECTIVE_VERIFIER_PACK"
          [ -d "$TRUSTED_VERIFIER_PACK" ] \
            || fail_setup "trusted_verifier_pack_unavailable" \
                 "verifier-pack '$EFFECTIVE_VERIFIER_PACK' is not a directory in the verified base commit"
        fi
        # The recommended path: pipe the diff; EvoGuard reverse-applies it to the head
        # checkout (this working dir) — no second checkout or worktree.
        ARGS=(guard --diff - --config "$BASE_POLICY_CONFIG" --report "$RUNNER_TEMP/guard-report.md" --json "$RUNNER_TEMP/guard.json")
        if [ -n "$TRUSTED_VERIFIER_PACK" ]; then ARGS+=(--verifier-pack "$TRUSTED_VERIFIER_PACK"); fi
        if [ -n "$EFFECTIVE_EXPECT_VERIFIER_PACK_SHA256" ]; then ARGS+=(--expect-verifier-pack-sha256 "$EFFECTIVE_EXPECT_VERIFIER_PACK_SHA256"); fi
        # BEGIN NON_PR_WORKFLOW_OVERRIDES
        # Every entry in this block shapes the judge or writes a report path.
        # It is deliberately unreachable on pull_request: the workflow itself
        # is candidate-controlled, while --config above came from BASE.
        if [ "$IS_PR" != "true" ]; then
          if [ -n "$INPUT_TEST_COMMAND" ]; then ARGS+=(--test-command "$INPUT_TEST_COMMAND"); fi
          if [ -n "$INPUT_PROTECTED" ]; then read -r -a PROTECTED <<< "$INPUT_PROTECTED"; ARGS+=(--protected "${PROTECTED[@]}"); fi
          if [ -n "$INPUT_ALLOW" ]; then read -r -a ALLOW <<< "$INPUT_ALLOW"; ARGS+=(--allow "${ALLOW[@]}"); fi
          if [ "$INPUT_ALLOW_NEW_TESTS" = "true" ]; then ARGS+=(--allow-new-tests); fi
          if [ -n "$INPUT_ISOLATION" ]; then ARGS+=(--isolation "$INPUT_ISOLATION"); fi
          if [ -n "$INPUT_DOCKER_IMAGE" ]; then ARGS+=(--docker-image "$INPUT_DOCKER_IMAGE"); fi
          if [ -n "$INPUT_DOCKER_NETWORK" ]; then ARGS+=(--docker-network "$INPUT_DOCKER_NETWORK"); fi
          if [ -n "$INPUT_OPERATING_PROFILE" ]; then ARGS+=(--operating-profile "$INPUT_OPERATING_PROFILE"); fi
          if [ "$INPUT_STRICT_HARNESS" = "true" ]; then
            ARGS+=(--strict-harness)
          elif [ "$INPUT_STRICT_HARNESS" = "false" ]; then
            ARGS+=(--no-strict-harness)
          fi
          if [ -n "$INPUT_TIMEOUT" ]; then ARGS+=(--timeout "$INPUT_TIMEOUT"); fi
          if [ -n "$INPUT_MEM_LIMIT" ]; then ARGS+=(--mem-limit "$INPUT_MEM_LIMIT"); fi
          if [ -n "$INPUT_SARIF" ]; then ARGS+=(--sarif "$INPUT_SARIF"); fi
          if [ "$INPUT_BLACKBOX" = "true" ]; then ARGS+=(--blackbox); fi
          if [ "$INPUT_BLACKBOX_ONLY" = "true" ]; then ARGS+=(--blackbox-only); fi
          if [ -n "$INPUT_REQUIRE_REPORT_INTEGRITY" ]; then ARGS+=(--require-report-integrity "$INPUT_REQUIRE_REPORT_INTEGRITY"); fi
          if [ -n "$INPUT_REQUIRE_CANDIDATE_ISOLATION" ]; then ARGS+=(--require-candidate-isolation "$INPUT_REQUIRE_CANDIDATE_ISOLATION"); fi
          if [ "$INPUT_TRUST_SETUP_ON_HOST" = "true" ]; then
            ARGS+=(--trust-setup-on-host)
          elif [ "$INPUT_TRUST_SETUP_ON_HOST" = "false" ]; then
            ARGS+=(--no-trust-setup-on-host)
          fi
          if [ "$INPUT_DIFF_COVERAGE" = "true" ]; then ARGS+=(--diff-coverage); fi
          if [ -n "$INPUT_MIN_DIFF_COVERAGE" ]; then ARGS+=(--min-diff-coverage "$INPUT_MIN_DIFF_COVERAGE"); fi
          if [ "$INPUT_BASELINE_EVIDENCE" = "true" ]; then ARGS+=(--baseline-evidence); fi
          if [ "$INPUT_REQUIRE_DEMONSTRATED_FIX" = "true" ]; then ARGS+=(--require-demonstrated-fix); fi
        fi
        # END NON_PR_WORKFLOW_OVERRIDES
        # Exact-revision binding: a plain `git diff` carries no commit identity,
        # so the signed/attested verdict would float free of the commit being
        # merged. Resolve and pass the real commit + tree SHAs.
        BASE_COMMIT="$(git rev-parse --verify --quiet "${BASE}^{commit}" || true)"
        HEAD_COMMIT="$(git rev-parse HEAD)"
        if [ -n "$BASE_COMMIT" ]; then
          ARGS+=(--base-sha "$BASE_COMMIT" --base-tree-sha "$(git rev-parse "${BASE_COMMIT}^{tree}")")
        fi
        ARGS+=(--head-sha "$HEAD_COMMIT" --head-tree-sha "$(git rev-parse "HEAD^{tree}")")
        set +e
        python -I "$RUNNER_TEMP/evo-guard.pyz" "${ARGS[@]}" < "$RUNNER_TEMP/guard.diff"
        GUARD_CODE=$?
        set -e
        # Surface the evidence (1.7): the attestation is the point of the newer
        # releases — make it reachable without custom steps.
        echo "json-path=$RUNNER_TEMP/guard.json" >> "$GITHUB_OUTPUT"
        echo "report-path=$RUNNER_TEMP/guard-report.md" >> "$GITHUB_OUTPUT"
        echo "head-sha=$HEAD_COMMIT" >> "$GITHUB_OUTPUT"
        # This is the first and only Action-side read of guard.json. The parser
        # bounds bytes before reading, rejects ambiguous JSON, and emits only
        # small validated sidecars for the shell-facing outputs below.
        write_agent_gate_summary "ERROR" "" "" "true" "$GUARD_CODE"
        STRICT_VERDICT="ERROR"
        if [ -f "$RUNNER_TEMP/guard-receipt.verdict" ]; then
          IFS= read -r STRICT_VERDICT < "$RUNNER_TEMP/guard-receipt.verdict"
        fi
        case "$STRICT_VERDICT" in
          PASS|REJECTED|FAIL|TAMPERED|ERROR) ;;
          *) STRICT_VERDICT="ERROR" ;;
        esac
        VERDICT="$STRICT_VERDICT"
        if [ "$VERDICT" != "PASS" ] && [ "$GUARD_CODE" -eq 0 ]; then
          GUARD_CODE=1
        fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        POLICY_SHA=""
        if [ -f "$RUNNER_TEMP/guard-receipt.policy" ]; then
          IFS= read -r POLICY_SHA < "$RUNNER_TEMP/guard-receipt.policy"
        fi
        echo "policy-sha=$POLICY_SHA" >> "$GITHUB_OUTPUT"
        RECEIPT_SHA256=""
        if [ -f "$RUNNER_TEMP/guard-receipt.sha256" ]; then
          IFS= read -r RECEIPT_SHA256 < "$RUNNER_TEMP/guard-receipt.sha256"
        fi
        echo "receipt-sha256=$RECEIPT_SHA256" >> "$GITHUB_OUTPUT"
        if [ -f "$RUNNER_TEMP/guard-report.md" ]; then
          {
            echo "<details><summary>Detailed Guard report</summary>"
            echo
            cat "$RUNNER_TEMP/guard-report.md"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$INPUT_FAIL_ON" = "rejected-only" ]; then
          [ "$VERDICT" = "REJECTED" ] && exit 1 || exit 0
        fi
        exit $GUARD_CODE
